let drawTool='pen', drawEnabled=false, drawActive=false, drawCtx=null, drawCanvas=null, drawLast=null, drawSaveTimer=null;
function setNotesMode(mode,subId,classId){
  const d=document.getElementById('drawNotesPane'), ty=document.getElementById('typeNotesPane');
  const db=document.getElementById('drawModeBtn'), tb=document.getElementById('typeModeBtn');

  if(db) db.className='btn '+(isDraw?'btn-accent':'btn-ghost');
  if(tb) tb.className='btn '+(!isDraw?'btn-accent':'btn-ghost');
  if(isDraw) requestAnimationFrame(()=>initNotesCanvas(subId,classId));
}
function toggleDrawing(){
  drawEnabled=!drawEnabled;
  drawActive=false;
  const c=document.getElementById('notesCanvas'), b=document.getElementById('drawToggleBtn');
  if(c) c.classList.toggle('draw-enabled',drawEnabled);
  if(b){
    b.className='btn '+(drawEnabled?'btn-accent':'btn-ghost');
    b.textContent=drawEnabled?'🔓 Pizarra activa':'🔒 Activar pizarra';
  }
}
function setDrawTool(tool){
  drawTool=tool==='eraser'?'eraser':'pen';
  const p=document.getElementById('penBtn'), e=document.getElementById('eraserBtn');
  if(p) p.className='btn '+(drawTool==='pen'?'btn-accent':'btn-ghost');
  if(e) e.className='btn '+(drawTool==='eraser'?'btn-accent':'btn-ghost');
}
function canvasPoint(ev){
  const r=drawCanvas.getBoundingClientRect();
  return {x:(ev.clientX-r.left)*(drawCanvas.width/r.width),y:(ev.clientY-r.top)*(drawCanvas.height/r.height)};
}
function initNotesCanvas(subId,classId){
  const c=document.getElementById('notesCanvas'); if(!c) return;
  const cls=getClass(getSubject(subId),classId); if(!cls) return;
  const ratio=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  const w=Math.max(280,Math.round(c.clientWidth*ratio)), h=Math.round(360*ratio);
  if(c.dataset.ready==='1' && c.width===w && c.height===h) return;
  c.width=w; c.height=h; c.dataset.ready='1'; drawCanvas=c; drawCtx=c.getContext('2d');
  drawCtx.lineCap='round'; drawCtx.lineJoin='round';
  if(cls.handwriting){
    const img=new Image(); img.onload=()=>drawCtx.drawImage(img,0,0,c.width,c.height); img.src=cls.handwriting;
  }
  if(c.dataset.bound==='1') return;
  c.dataset.bound='1';
  c.addEventListener('pointerdown',ev=>{ if(!drawEnabled) return; ev.preventDefault(); drawCanvas=c; drawCtx=c.getContext('2d'); drawActive=true; drawLast=canvasPoint(ev); try{c.setPointerCapture(ev.pointerId)}catch(e){} });
  c.addEventListener('pointermove',ev=>{
    if(!drawEnabled || !drawActive) return; ev.preventDefault();
    const pt=canvasPoint(ev), size=Number(document.getElementById('drawSize')?.value||4)*(c.width/c.clientWidth);
    drawCtx.globalCompositeOperation=drawTool==='eraser'?'destination-out':'source-over';
    drawCtx.strokeStyle=document.getElementById('drawColor')?.value||'#202020';
    drawCtx.lineWidth=drawTool==='eraser'?size*3:size;
    drawCtx.beginPath(); drawCtx.moveTo(drawLast.x,drawLast.y); drawCtx.lineTo(pt.x,pt.y); drawCtx.stroke(); drawLast=pt;
  });
  const finish=()=>{ if(!drawActive)return; drawActive=false; clearTimeout(drawSaveTimer); drawSaveTimer=setTimeout(()=>saveDrawing(subId,classId),120); };
  c.addEventListener('pointerup',finish); c.addEventListener('pointercancel',finish);
}
function saveDrawing(subId,classId){
  const cls=getClass(getSubject(subId),classId), c=document.getElementById('notesCanvas');
  if(!cls||!c) return; cls.handwriting=c.toDataURL('image/png',0.92); persist();
}
function clearDrawing(subId,classId){
  const cls=getClass(getSubject(subId),classId), c=document.getElementById('notesCanvas');
  if(!cls||!c) return;
  if(cls.handwriting && !confirm('¿Borrar los apuntes escritos a mano?')) return;
  const ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height); cls.handwriting=''; persist(true);
}

/* ---------- Lectura local de documentos ---------- */
function fileKind(name){
  const ext=(name||'').split('.').pop().toLowerCase();
  if(ext==='pdf') return 'pdf';
  if(ext==='docx') return 'docx';
  if(ext==='doc') return 'doc';
  if(ext==='pptx') return 'pptx';
  if(ext==='ppt') return 'ppt';
  if(ext==='txt' || ext==='md' || ext==='csv') return 'txt';
  if(['png','jpg','jpeg','webp','gif'].includes(ext)) return 'image';
  return ext || 'file';
}
function cleanExtractedText(text){
  return repairLetterSpacedText((text||'')
    .replace(/\u0000/g,' ')
    .replace(/[ \t]+\n/g,'\n')
    .replace(/\n{4,}/g,'\n\n\n')
    .replace(/[ \t]{2,}/g,' ')
    .trim());
}
async function extractPdfText(file){
  if(!window.pdfjsLib) throw new Error('PDF.js no está disponible');
  const buf=await file.arrayBuffer();
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const parts=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i);
    const content=await page.getTextContent();
    const text=content.items.map(x=>x.str||'').join(' ').replace(/\s+/g,' ').trim();
    if(text) parts.push(`[Página ${i}]\n${text}`);
  }
  return cleanExtractedText(parts.join('\n\n'));
}
async function extractDocxText(file){
  if(!window.mammoth) throw new Error('Mammoth no está disponible');
  const buf=await file.arrayBuffer();
  const result=await mammoth.extractRawText({arrayBuffer:buf});
  return cleanExtractedText(result.value||'');
}
async function extractPptxText(file){
  if(!window.JSZip) throw new Error('JSZip no está disponible');
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const slideNames=Object.keys(zip.files)
    .filter(n=>/^ppt\/slides\/slide\d+\.xml$/i.test(n))
    .sort((a,b)=>{
      const na=parseInt((a.match(/slide(\d+)\.xml/i)||[])[1]||0,10);
      const nb=parseInt((b.match(/slide(\d+)\.xml/i)||[])[1]||0,10);
      return na-nb;
    });
  const parser=new DOMParser();
  const slides=[];
  for(let i=0;i<slideNames.length;i++){
    const xml=await zip.file(slideNames[i]).async('text');
    const doc=parser.parseFromString(xml,'application/xml');
    const nodes=[...doc.getElementsByTagNameNS('*','t')];
    const text=nodes.map(n=>n.textContent||'').join(' ').replace(/\s+/g,' ').trim();
    slides.push(`[Diapositiva ${i+1}]\n${text || '(sin texto extraíble)'}`);
  }
  return cleanExtractedText(slides.join('\n\n'));
}
async function extractFileText(file){
  const kind=fileKind(file.name);
  try{
    let text='';
    if(kind==='pdf') text=await extractPdfText(file);
    else if(kind==='docx') text=await extractDocxText(file);
    else if(kind==='pptx') text=await extractPptxText(file);
    else if(kind==='txt') text=cleanExtractedText(await file.text());
    else if(kind==='doc' || kind==='ppt'){
      return {text:'',extracted:false,reason:'Los formatos antiguos .doc y .ppt no se pueden interpretar de forma fiable dentro del navegador. Guárdalos como .docx o .pptx para que Fractal Notebook pueda leerlos.'};
    } else if(kind==='image'){
      return {text:'',extracted:false,reason:'La imagen se puede visualizar, pero esta versión no aplica OCR al texto de imágenes.'};
    }
    return {text,extracted:!!text,reason:text?'':'El archivo no contiene texto extraíble (por ejemplo, puede ser un PDF escaneado).'};
  }catch(e){
    console.error('Error extrayendo texto:',e);
    return {text:'',extracted:false,reason:(e&&e.message)||'No se pudo leer el archivo.'};
  }
}
async function onFileSelected(subId,classId){
  const input = document.getElementById('fileInput');
  const file = input.files[0];
  if(!file) return;
  const sub = getSubject(subId), cls = getClass(sub,classId);
  cls.files = cls.files||[];
  const fileId = uid();
  const placeholder = {id:fileId, name:file.name, kind:fileKind(file.name), text:'', extracted:false, reading:true, readReason:''};
  cls.files.push(placeholder);
  render();
  try{ await saveFileBlob(fileId, file); }catch(e){ console.error('No se pudo guardar el archivo original:', e); }
  const result = await extractFileText(file);
  placeholder.text = result.text||'';
  placeholder.extracted = !!result.extracted;
  placeholder.reading = false;
  placeholder.readReason = result.reason||'';
  persist(true);
  render();
}

/* ---------- Modales ---------- */
let modalState = {type:null, color:COLORS[0], icon:ICONS[0], editId:null};
function openModal(type){ modalState = {type, color:COLORS[0], icon:ICONS[0], editId:null}; renderModal(); }
function openEditModal(type,item){ modalState = {type, color:item.color||COLORS[0], icon:item.icon||ICONS[0], editId:item.id}; renderModal(); }
function closeModal(){ modalState.type=null; renderModal(); }
function renderModal(){
  let host = document.getElementById('modalHost');
  if(!host){ host = document.createElement('div'); host.id='modalHost'; document.body.appendChild(host); }
  if(!modalState.type){ host.innerHTML=''; return; }
  const editing = !!modalState.editId;
  if(modalState.type==='aiInfo'){
    host.innerHTML = `<div class="modal-bg"><div class="modal"><div class="handle"></div>
      <h3>🧠 Generación local gratuita</h3>
      <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-bottom:10px;">Fractal Notebook ya no usa Groq, Grok ni Claude y <b>no necesita ninguna API key</b>. Los apuntes, cuestionarios y chat intentan ejecutarse directamente en tu dispositivo.</p>
      <div class="info" style="margin-bottom:10px;"><b>Sin claves ni pagos:</b> los apuntes y cuestionarios se crean directamente en tu dispositivo usando el contenido de cada clase.</div>
      <div class="info"><b>Compatibilidad:</b> no necesita WebGPU, API key ni descargar un modelo grande. Funciona también en celulares compatibles con esta app.</div>
      <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Entendido</button></div>
    </div></div>`;
  } else if(modalState.type==='driveSetup'){
    const configured=!!getEmbeddedDriveClientId();
    host.innerHTML = `<div class="modal-bg"><div class="modal"><div class="handle"></div>
      <h3>☁️ Google Drive</h3>
      ${configured ? `
        <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-bottom:12px;">Conecta tu cuenta de Google para guardar las grabaciones directamente en tu Drive.</p>
        <div class="modal-actions" style="flex-wrap:wrap;">
          ${driveAccessToken?'<button class="btn btn-ghost" onclick="disconnectGoogleDrive()">Desconectar</button>':''}
          <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="connectGoogleDrive()">Continuar con Google</button>
        </div>` : `
        <p style="font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-bottom:12px;">La conexión de Google aún no está habilitada por el administrador de esta copia de Fractal Notebook.</p>
        <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Entendido</button></div>`}
    </div></div>`;
  } else if(modalState.type==='newNotebook'){
    const nb = editing ? getNotebook(modalState.editId) : null;
    host.innerHTML = `<div class="modal-bg"><div class="modal"><div class="handle"></div>
      <h3>${editing?'Editar cuaderno':'Nuevo cuaderno'}</h3>
      <div class="field"><label>Nombre</label><input id="nbName" placeholder="Ej: Semestre 1 - 2026" value="${escapeHtml(nb?nb.name:'')}"/></div>
      <div class="field"><label>Ícono</label><div class="color-row">${ICONS.map(i=>`<span style="font-size:22px;cursor:pointer;padding:4px;${i===modalState.icon?'outline:2px solid var(--accent);border-radius:6px;':''}" onclick="modalState.icon='${i}';renderModal()">${i}</span>`).join('')}</div></div>
      <div class="field"><label>Color</label><div class="color-row">${COLORS.map(c=>`<span class="swatch ${c===modalState.color?'sel':''}" style="background:${c}" onclick="modalState.color='${c}';renderModal()"></span>`).join('')}</div></div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="createNotebook()">${editing?'Guardar':'Crear'}</button></div>
    </div></div>`;
  } else if(modalState.type==='newSubject'){
    const sub = editing ? getSubject(modalState.editId) : null;
    host.innerHTML = `<div class="modal-bg"><div class="modal"><div class="handle"></div>
      <h3>${editing?'Editar asignatura':'Nueva asignatura'}</h3>
      <div class="field"><label>Nombre</label><input id="subjName" placeholder="Ej: Ingeniería de Audio" value="${escapeHtml(sub?sub.name:'')}"/></div>
      <div class="field"><label>Ícono</label><div class="color-row">${ICONS.map(i=>`<span style="font-size:22px;cursor:pointer;padding:4px;${i===modalState.icon?'outline:2px solid var(--accent);border-radius:6px;':''}" onclick="modalState.icon='${i}';renderModal()">${i}</span>`).join('')}</div></div>
      <div class="field"><label>Color</label><div class="color-row">${COLORS.map(c=>`<span class="swatch ${c===modalState.color?'sel':''}" style="background:${c}" onclick="modalState.color='${c}';renderModal()"></span>`).join('')}</div></div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="createSubject()">${editing?'Guardar':'Crear'}</button></div>
    </div></div>`;
  } else if(modalState.type==='newClass'){
    let cls = null;
    if(editing){ const sub = getSubject(state.view.subjectId); cls = sub ? getClass(sub, modalState.editId) : null; }
    host.innerHTML = `<div class="modal-bg"><div class="modal"><div class="handle"></div>
      <h3>${editing?'Editar clase':'Nueva clase'}</h3>
      <div class="field"><label>Nombre de la clase</label><input id="clsName" placeholder="Ej: Clase 5" value="${escapeHtml(cls?cls.name:'')}"/></div>
      <div class="field"><label>Fecha</label><input id="clsDate" type="date" value="${cls?cls.date||'':''}"/></div>
      <div class="field"><label>Profesor/a</label><input id="clsProf" placeholder="Nombre del profesor" value="${escapeHtml(cls?cls.professor:'')}"/></div>
      <div class="field"><label>Unidad o tema</label><input id="clsTopic" placeholder="Ej: Compresión y dinámica" value="${escapeHtml(cls?cls.topic:'')}"/></div>
      <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="createClass()">${editing?'Guardar':'Crear'}</button></div>
    </div></div>`;
  }
}
function createNotebook(){
  const name = document.getElementById('nbName').value.trim();
  if(!name) return;
  if(modalState.editId){
    const nb = getNotebook(modalState.editId);
    if(nb){ nb.name=name; nb.icon=modalState.icon; nb.color=modalState.color; }
  } else {
    state.notebooks.push({id:uid(), name, icon:modalState.icon, color:modalState.color, subjects:[]});
  }
  closeModal(); persist(true); render();
}
function createSubject(){
  const name = document.getElementById('subjName').value.trim();
  if(!name) return;
  if(modalState.editId){
    const sub = getSubject(modalState.editId);
    if(sub){ sub.name=name; sub.icon=modalState.icon; sub.color=modalState.color; }
  } else {
    const nb = getNotebook(state.view.notebookId);
    if(!nb) return;
    nb.subjects.push({id:uid(), name, icon:modalState.icon, color:modalState.color, classes:[], events:[]});
  }
  closeModal(); persist(true); render();
}
function createClass(){
  const sub = getSubject(state.view.subjectId);
  const name = document.getElementById('clsName').value.trim();
  if(!name || !sub) return;
  const date = document.getElementById('clsDate').value;
  const professor = document.getElementById('clsProf').value.trim();
  const topic = document.getElementById('clsTopic').value.trim();
  if(modalState.editId){
    const cls = getClass(sub, modalState.editId);
    if(cls){ cls.name=name; cls.date=date; cls.professor=professor; cls.topic=topic; }
  } else {
    sub.classes.push({ id:uid(), name, date, professor, topic, transcript:[], studentNotes:'', aiNotes:null, files:[], quiz:null });
  }
  closeModal(); persist(true); render();
}

/* ---------- Eliminar ---------- */
function deleteNotebook(id){
  const nb = getNotebook(id);
  if(!nb) return;
  if(!confirm(`¿Eliminar el cuaderno "${nb.name}" y todo su contenido? Esta acción no se puede deshacer.`)) return;
  nb.subjects.forEach(s=> delete state.chatBySubject[s.id]);
  state.notebooks = state.notebooks.filter(n=>n.id!==id);
  persist(true);
  if(state.view.notebookId===id){ navigateTo({screen:'notebooks'}); } else { render(); }
}
function deleteSubject(id){
  const nb = getSubjectNotebook(id);
  const sub = getSubject(id);
  if(!nb || !sub) return;
  if(!confirm(`¿Eliminar la asignatura "${sub.name}" y todas sus clases? Esta acción no se puede deshacer.`)) return;
  delete state.chatBySubject[id];
  nb.subjects = nb.subjects.filter(s=>s.id!==id);
  persist(true);
  if(state.view.subjectId===id){ navigateTo({screen:'home', notebookId:nb.id}); } else { render(); }
}
function deleteClass(subId,classId){
  const sub = getSubject(subId);
  if(!sub) return;
  const cls = getClass(sub,classId);
  if(!cls) return;
  if(!confirm(`¿Eliminar la clase "${cls.name}"? Esta acción no se puede deshacer.`)) return;
  if(cls.recording){ stopRecording(sub,cls); }
  deleteAudioBlob(classId).catch(()=>{});
  sub.classes = sub.classes.filter(c=>c.id!==classId);
  persist(true);
  if(state.view.classId===classId){ navigateTo({screen:'subject', notebookId:state.view.notebookId, subjectId:subId, section:'clases'}); } else { render(); }
}

loadGisScript().catch(()=>{});
loadState();
