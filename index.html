<style>
  :root{
    --paper:#f3ecd6;
    --paper-line:rgba(74,100,175,.28);
    --card:#fffdf6;
    --card2:#faf3df;
    --ink:#2b2416;
    --ink-soft:#847a63;
    --margin:#d9948f;
    --binding:#a89d80;
    --accent:#b9862b;
    --accent-strong:#8f6a1f;
    --accent-soft:rgba(185,134,43,.16);
    --danger:#b0503e;
    --danger-soft:rgba(176,80,62,.14);
    --ok:#5f8a4a;
    --ok-soft:rgba(95,138,74,.15);
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;width:100%;overflow-x:hidden;background:#d8cfae;}
  body{color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;line-height:1.5;}
  h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.01em;margin:0;color:var(--ink);}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  /* ---- Marco tipo cuaderno, ancho fijo de celular ---- */
  .notebook{position:relative;max-width:430px;margin:0 auto;min-height:100vh;background:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,.35), transparent 40%),
      var(--paper);padding-left:30px;box-shadow:0 0 60px rgba(30,24,10,.25);}
  .notebook::before{content:'';position:absolute;left:0;top:0;bottom:0;width:26px;background:linear-gradient(90deg, rgba(0,0,0,.10), transparent 75%);}
  .notebook::after{content:'';position:absolute;left:6px;top:0;bottom:0;width:15px;background-image:radial-gradient(circle, var(--binding) 4px, transparent 4.3px);background-size:15px 26px;background-repeat:repeat-y;background-position:0 10px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));}
  #app{position:relative;z-index:1;min-height:100vh;padding-bottom:40px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 10px;background:linear-gradient(180deg,var(--card2),var(--paper));border-bottom:2px solid var(--paper-line);position:sticky;top:0;z-index:20;gap:10px;}
  .topbar .brand{flex:1;min-width:0;display:flex;align-items:center}.topbar .brand img{height:66px;width:min(100%,390px);max-width:100%;display:block;object-fit:contain;object-position:left center;filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));}
  .save-indicator{font-size:11px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;}
  .save-indicator .tick{color:var(--ok);}
  main{padding:18px 16px 50px;}
  .btn{border:none;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:700;min-height:44px;transition:transform .08s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(180deg,#c99a3f,var(--accent));color:#fff;box-shadow:0 3px 0 var(--accent-strong);}
  .btn-accent{background:linear-gradient(180deg,#c99a3f,var(--accent));color:#fff;box-shadow:0 3px 0 var(--accent-strong);}
  .btn-ghost{background:var(--card);color:var(--ink-soft);border:1.5px solid rgba(0,0,0,.08);}
  .btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger-soft);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  ::selection{background:var(--accent-soft);color:var(--ink);}
  /* Home */
  .greeting{margin-bottom:18px;}
  .greeting h1{font-size:27px;}
  .greeting p{color:var(--ink-soft);margin-top:4px;font-size:13.5px;}
  .subject-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .subject-card{position:relative;border-radius:var(--radius);padding:18px 14px 16px;background:linear-gradient(155deg,color-mix(in srgb,var(--c) 92%, white),var(--c));color:#fff;border:1px solid rgba(0,0,0,.08);box-shadow:0 4px 0 rgba(0,0,0,.10),0 6px 14px rgba(40,30,10,.10);cursor:pointer;overflow:hidden;}
  .subject-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.16),transparent 48%);pointer-events:none;}
  .subject-card::after{content:'';position:absolute;bottom:0;right:0;width:0;height:0;border-style:solid;border-width:0 0 16px 16px;border-color:transparent transparent rgba(0,0,0,.07) transparent;}
  .card-delete{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(20,15,5,.42);color:#fff;border:none;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:2;line-height:1;padding:0;}
  .card-delete:active{background:var(--danger);}
  .card-edit{position:absolute;top:8px;right:38px;width:24px;height:24px;border-radius:50%;background:rgba(20,15,5,.42);color:#fff;border:none;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:2;line-height:1;padding:0;}
  .card-edit:active{background:var(--accent);}
  .icon-btn{border:none;background:var(--card2);color:var(--ink-soft);width:30px;height:30px;border-radius:50%;font-size:13px;display:inline-flex;align-items:center;justify-content:center;padding:0;}
  .icon-btn:active{background:var(--accent-soft);color:var(--accent-strong);}
  .subject-card .icon{font-size:24px;margin-top:6px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.4));}
  .subject-card h3{margin-top:8px;font-size:16px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.16);}
  .subject-card .meta{color:rgba(255,255,255,.88);font-size:11.5px;margin-top:3px;}
  .subject-card.new{display:flex;align-items:center;justify-content:center;color:var(--ink-soft);border:1.5px dashed var(--paper-line);font-weight:600;font-family:'Space Grotesk',sans-serif;font-size:14.5px;box-shadow:none;background:transparent;}
  .section-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink);margin:26px 0 10px;display:flex;align-items:center;gap:6px;}
  .list-row{background:var(--card);border-radius:10px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;border:1px solid rgba(0,0,0,.05);box-shadow:0 2px 0 rgba(0,0,0,.03);}
  /* Subject view */
  .subject-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;-webkit-overflow-scrolling:touch;}
  .subject-tabs a{flex:0 0 auto;padding:8px 13px;border-radius:20px;background:var(--card);color:var(--ink-soft);text-decoration:none;font-size:13.5px;font-weight:600;border:1px solid rgba(0,0,0,.06);white-space:nowrap;}
  .subject-tabs a.active{background:linear-gradient(180deg,#c99a3f,var(--accent));color:#fff;box-shadow:0 2px 0 var(--accent-strong);}
  .class-card{position:relative;background:linear-gradient(155deg,color-mix(in srgb,var(--c) 88%, white),var(--c));color:#fff;border-radius:12px;padding:13px 76px 13px 15px;margin-bottom:10px;cursor:pointer;border:1px solid rgba(0,0,0,.07);box-shadow:0 3px 0 rgba(0,0,0,.08);}
  .card-delete-inline{background:rgba(0,0,0,.25);color:#fff;top:10px;right:10px;}
  .card-delete-inline:active{background:var(--danger);color:#fff;}
  .card-edit-inline{position:absolute;top:10px;right:40px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.25);color:#fff;border:none;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:2;line-height:1;padding:0;}

<body>
<div class="notebook"><div id="app"></div></div>

<script>
/* ---------- Estado ---------- */
let state = {
  user: null,
  notebooks: [], // {id,name,icon,color,subjects:[...]}
  view: {screen:'notebooks', notebookId:null, subjectId:null, classId:null, section:'clases'},
  chatBySubject: {},
  driveClientId: null,
  saving: 'Guardado'
};

let audioNews={items:[],loading:false,error:'',filter:'Todas',loadedAt:0};
const AUDIO_NEWS_SOURCES=['Todas','Audio Música Digital','Diffusion Magazine','Revista de Acústica','ISP Música'];

const ICONS = ['🎚️','🎛️','🎧','🔊','🎹','🎤','📡','🖥️','📀','🌀'];
const COLORS = ['#b9862b','#4a7f8c','#a4543f','#5f8a4a','#8a5fa8','#c1731f','#356a8a','#9a4f72','#2f7a68','#7b5a3e','#6267a8','#a65d2f','#3f7661','#8b6c24'];
const LOGO_SRC = "/logo-fractal.svg";

/* ---------- Persistencia ---------- */
const storageAdapter = {
  async get(key){
    if(window.storage && window.storage.get){
      try{ return await window.storage.get(key, false); }catch(e){ return null; }
    }
    try{
      const v = localStorage.getItem(key);
      return v!==null ? {value:v} : null;
    }catch(e){ return null; }
  },
  async set(key, value){
    if(window.storage && window.storage.set){
      return await window.storage.set(key, value, false);
    }
    localStorage.setItem(key, value);
    return true;
  }
};
const STORAGE_KEY = 'fractal_notebook_state_v2';
async function loadState(){
  let loadedNew = false;
  try{
    const r = await storageAdapter.get(STORAGE_KEY);
    if(r && r.value){
      const parsed = JSON.parse(r.value);
      state.notebooks = parsed.notebooks || [];
      state.chatBySubject = parsed.chatBySubject || {};
      state.driveClientId = parsed.driveClientId || null;
      state.user = parsed.user || null;
      loadedNew = true;
    }
  }catch(e){ /* aún no existe esta clave nueva — normal en la primera carga o al migrar */ }
  if(!loadedNew){
    // Migración desde el formato anterior (una sola lista de asignaturas sin cuadernos)
    try{
      const old = await storageAdapter.get('smartnotebook_state');
      if(old && old.value){
        const parsedOld = JSON.parse(old.value);
        if(parsedOld.subjects && parsedOld.subjects.length){
          state.notebooks = [{id:uid(), name:'Mi cuaderno', icon:'📓', color:COLORS[0], subjects:parsedOld.subjects}];
        }
        state.chatBySubject = parsedOld.chatBySubject || {};
        state.user = parsedOld.user || null;
        await saveNow();
      }
    }catch(e){ /* tampoco hay datos antiguos — usuario nuevo, se parte en blanco */ }
  }
  try{ history.replaceState({view: state.view}, '', '#'+state.view.screen); }catch(e){}
  render();
}
let saveTimer=null;
async function saveNow(retries){
  retries = retries===undefined ? 2 : retries;
  const payload = JSON.stringify({notebooks:state.notebooks, chatBySubject:state.chatBySubject, user:state.user, driveClientId:state.driveClientId});
  for(let attempt=0; attempt<=retries; attempt++){
    try{
      await storageAdapter.set(STORAGE_KEY, payload);
      state.saving='Guardado'; renderSaveIndicator();
      return true;
    }catch(e){
      console.error('Intento de guardado '+(attempt+1)+' falló:', e);
      if(attempt<retries) await new Promise(r=>setTimeout(r,400*(attempt+1)));
    }
  }
  state.saving='Guardado'; renderSaveIndicator(); // no alarmamos al usuario; queda registrado en consola
  return false;
}
function persist(immediate){
  state.saving='Guardando…'; renderSaveIndicator();
  clearTimeout(saveTimer);
  if(immediate){ saveNow(); return; }
  saveTimer=setTimeout(()=>{ saveNow(); }, 300);
}
// Aseguramos que nada se pierda si el usuario cambia de pestaña o cierra el navegador
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden'){ clearTimeout(saveTimer); saveNow(); } });
window.addEventListener('pagehide', ()=>{ clearTimeout(saveTimer); saveNow(); });
function renderSaveIndicator(){
  const el = document.getElementById('saveInd');
  if(el) el.innerHTML = state.saving==='Guardado' ? '<span class="tick">✓</span> Guardado' : state.saving;
}

/* ---------- Utilidades ---------- */
const uid = ()=>Math.random().toString(36).slice(2,10);
function getNotebook(id){ return state.notebooks.find(n=>n.id===id); }
function getSubject(id){ for(const nb of state.notebooks){ const s=nb.subjects.find(x=>x.id===id); if(s) return s; } return null; }
function getSubjectNotebook(subId){ return state.notebooks.find(nb=>nb.subjects.some(s=>s.id===subId)); }
function getClass(sub, id){ return sub.classes.find(c=>c.id===id); }
function escapeHtml(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function stripHtml(html){ const d=document.createElement('div'); d.innerHTML=html||''; return d.textContent||''; }

/* ---------- IA LOCAL GRATUITA (sin API key) ---------- */
// Motor local ligero: funciona sin API, sin WebGPU y sin descargar modelos grandes.
// Analiza únicamente el contenido guardado en la clase (transcripción, apuntes y archivos).
function aiConfigured(){ return true; }

// Corrige texto de PDFs/PPT exportados con espaciado entre letras.
// Ej.: "P O R  L O  T A N T O" -> "POR LO TANTO" y "C AMPO" -> "CAMPO".
function repairLetterSpacedText(text){
  let t=(text||'').replace(/\u00a0/g,' ');
  const commonWords=new Set(('a al algo algunas algunos ante antes bajo bien cada casi como con contra cual cuando de del desde donde durante e el ella ellas ellos en entre era eran es esa esas ese esos esta estaba estaban este esto estos fue fueron ha hay hacia la las le les lo los mas más me mi muy ni no nos o para pero por porque que se sin sobre su sus te tu un una uno unas unos y ya campo sonido sonidos fuente oyente local superficie superficies energía ondas directo reflejado reflejadas reflejarse existe siempre ubicación momento momentos distintos disposición cantidad puede único emitido percibido acústicas psicoacústicas bases medio uniforme creando menudo hipótesis difuso densidad').split(/\s+/));

  // Une grupos muy fragmentados (3+ piezas de 1-2 letras en mayúsculas).
  t=t.replace(/(?:\b[A-ZÁÉÍÓÚÜÑ]{1,2}\b[ \t]+){2,}\b[A-ZÁÉÍÓÚÜÑ]{1,2}\b/g, m=>{
    const compact=m.replace(/[ \t]+/g,'');
    const lower=compact.toLowerCase();
    if(commonWords.has(lower)) return compact;
    // Intenta segmentar expresiones frecuentes: PORLOTANTO -> POR LO TANTO.
    const words=[...commonWords].filter(w=>w.length>1).sort((a,b)=>b.length-a.length);
    const dp=new Array(lower.length+1).fill(null); dp[0]=[];
    for(let i=0;i<lower.length;i++) if(dp[i]){
      for(const w of words){
        if(lower.startsWith(w,i)){
          const j=i+w.length;
          const cand=dp[i].concat(w);
          if(!dp[j] || cand.length<dp[j].length) dp[j]=cand;
        }
      }
    }
    if(dp[lower.length] && dp[lower.length].length>1){
      let pos=0; return dp[lower.length].map(w=>{ const part=compact.slice(pos,pos+w.length); pos+=w.length; return part; }).join(' ');
    }
    return compact;
  });

  // Reparaciones de inicio de palabra muy comunes producidas por PPT/PDF.
  t=t.replace(/\b([CDLMPSTU])\s+([A-ZÁÉÍÓÚÜÑ]{2,})\b/g,(m,a,b)=>{
    const joined=(a+b).toLowerCase();
    return commonWords.has(joined) ? a+b : m;
  });

  // Frases frecuentes que pueden quedar compactadas tras la unión.
  const phraseFixes={
    'PORLOTANTO':'POR LO TANTO','DELO':'DE LO','DELAS':'DE LAS','DELOS':'DE LOS',
    'ENEL':'EN EL','ENLA':'EN LA','ENLAS':'EN LAS','ENLOS':'EN LOS',
    'ALA':'A LA','ALAS':'A LAS','ALOS':'A LOS','PORLA':'POR LA','PORLAS':'POR LAS','POREl':'POR EL',
    'DELA':'DE LA','YDEL':'Y DEL','YDELA':'Y DE LA','QUEEL':'QUE EL','QUELA':'QUE LA'
  };
  for(const [a,b] of Object.entries(phraseFixes)) t=t.replace(new RegExp('\\b'+a+'\\b','gi'),b);
  return t.replace(/[ \t]{2,}/g,' ').replace(/ *\n */g,'\n').trim();
}
function sourceTextForClass(cls){
  const transcript = (cls.transcript||[]).map(t=>repairLetterSpacedText(t.text||'')).join(' ');
  const notes = repairLetterSpacedText(stripHtml(cls.studentNotes||''));
  const files = (cls.files||[]).map(f=>repairLetterSpacedText(f.text||'')).join(' ');
  return repairLetterSpacedText([transcript, notes, files].filter(Boolean).join('\n')).replace(/\s+/g,' ').trim();
}
function normalizeWords(text){
  const stop = new Set('a al algo algunas algunos ante antes como con contra cual cuando de del desde donde durante e el ella ellas ellos en entre era eran es esa esas ese esos esta estaba estaban este esto estos fue fueron ha hay hacia la las le les lo los mas más me mi muy ni no nos o para pero por porque que se sin sobre su sus te tu un una uno unas unos y ya'.split(' '));
  return (text||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').match(/[a-zñü]{4,}/g)?.filter(w=>!stop.has(w)) || [];
}
function sentenceList(text){
  const cleaned=(text||'').replace(/\s+/g,' ').trim();
  if(!cleaned) return [];
  let arr=cleaned.split(/(?<=[.!?])\s+|\n+/).map(x=>x.trim()).filter(Boolean);
  if(arr.length<3){
    arr=cleaned.match(/.{1,240}(?:\s|$)/g)?.map(x=>x.trim()).filter(x=>x.length>20) || arr;
  }
  return arr.filter(x=>x.length>=20).slice(0,140);
}
function rankSentences(text, limit=12){
  const sentences=sentenceList(text);
  if(!sentences.length) return [];
  const freq={};
  for(const w of normalizeWords(text)) freq[w]=(freq[w]||0)+1;
  const scored=sentences.map((sentence,idx)=>{
    const words=normalizeWords(sentence);
    const unique=[...new Set(words)];
    const score=unique.reduce((a,w)=>a+(freq[w]||0),0)/Math.max(5,Math.sqrt(words.length||1));
    const positionBonus=idx<3?1.15:1;
    return {sentence,idx,score:score*positionBonus};
  });
  return scored.sort((a,b)=>b.score-a.score).slice(0,limit).sort((a,b)=>a.idx-b.idx).map(x=>x.sentence);
}
function topKeywords(text, limit=10){
  const freq={};
  for(const w of normalizeWords(text)) freq[w]=(freq[w]||0)+1;
  return Object.entries(freq).sort((a,b)=>b[1]-a[1] || b[0].length-a[0].length).slice(0,limit).map(x=>x[0]);
}
function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function cleanStudySource(text){
  return repairLetterSpacedText(text||'')
    .replace(/\[P[aá]gina\s*\d+\]/gi,' ')
    .replace(/\bP[aá]gina\s*\d+\b/gi,' ')
    .replace(/\[(?:Diapositiva|Slide)\s*\d+\]/gi,' ')
    .replace(/\b(?:Diapositiva|Slide)\s*\d+\b/gi,' ')
    .replace(/\b0\d(?:\s+0\d){2,}\b/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function usefulStudySentence(s){
  const x=(s||'').trim();
  if(x.length<35) return false;
  if(/fechas? importantes|bienvenidos|introducci[oó]n\s*$|conclusiones?\s*$|evaluaci[oó]n.*semana|entrega.*informe.*semana/i.test(x)) return false;
  const letters=(x.match(/[a-záéíóúñü]/gi)||[]).length;
  return letters/Math.max(1,x.length)>.55;
}
function generateLocalNotes(cls){
  const text=cleanStudySource(sourceTextForClass(cls));
  if(text.length<30) return '## Sin contenido suficiente\nAgrega contenido de la clase para generar el apunte.';
  const candidates=sentenceList(text).filter(usefulStudySentence);
  const base=candidates.join(' ');
  const ranked=rankSentences(base||text,10).filter(usefulStudySentence);
  const keywords=topKeywords(base||text,8).map(cap);
  const main=ranked[0]||candidates[0]||text.slice(0,220);
  const key=ranked.slice(1,6);
  const examples=candidates.filter(s=>/\bpor ejemplo\b|\bconsiste en\b|\bse utiliza\b|\bpermite\b/i.test(s)).slice(0,2);
  let out=`## Idea principal\n${main}`;
  if(key.length) out+=`\n\n## Puntos clave\n${key.map(x=>'- '+x).join('\n')}`;
  if(keywords.length) out+=`\n\n## Conceptos\n${keywords.slice(0,6).map(x=>'- '+x).join('\n')}`;
  if(examples.length) out+=`\n\n## Ejemplos\n${examples.map(x=>'- '+x).join('\n')}`;
  return out;
}
function buildDistractors(target, keywords, used){
  const t=target.toLowerCase();
  const out=[];
  for(const k of keywords){
    if(k.toLowerCase()!==t && !used.has(k.toLowerCase()) && Math.abs(k.length-target.length)<=7){ out.push(cap(k)); used.add(k.toLowerCase()); }
    if(out.length===3) break;
  }
  const fillers=['Proceso','Concepto','Elemento','Estructura','Sistema','Función','Modelo'];
  for(const f of fillers){ if(out.length<3 && f.toLowerCase()!==t) out.push(f); }
  return out.slice(0,3);
}
function shuffledQuestion(question, correct, distractors){
  const options=[correct,...distractors];
  // mezcla determinística para que la correcta no quede siempre primera
  const shift=(question.length + correct.length)%4;
  const rotated=options.slice(shift).concat(options.slice(0,shift));
  return {question,options:rotated,correctIndex:rotated.indexOf(correct),selected:null};
}

function quizCleanText(s){
  return (s||'').replace(/\s+/g,' ').replace(/^[•\-–—]\s*/,'').trim();
}
function quizJunk(s){
  return /errores? de lectura|archivos? digitales?|p[aá]gina|diapositiva|slide|evaluaci[oó]n|semana|entrega|informe|bienvenid|objetivos? de la clase|fecha|bibliograf[ií]a|referencias?/i.test(s||'');
}
function quizNorm(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9ñü]+/g,' ').replace(/\s+/g,' ').trim();
}
function quizShort(s,max=118){
  let x=quizCleanText(s).replace(/[.;:\s]+$/,'');
  if(x.length>max) x=x.slice(0,max-1).replace(/\s+\S*$/,'')+'…';
  return x;
}
function quizFacts(text){
  const facts=[], seen=new Set();
  const sentences=sentenceList(cleanStudySource(text)).filter(usefulStudySentence);
  const patterns=[
    {type:'definition',rx:/^(.{3,60}?)\s+(?:es|son|se define como|se entiende como|consiste en)\s+(.{18,190})$/i},
    {type:'function',rx:/^(.{3,60}?)\s+(?:permite|permiten|sirve para|sirven para|se utiliza para|se utilizan para|tiene como funci[oó]n)\s+(.{18,190})$/i},
    {type:'feature',rx:/^(.{3,60}?)\s+(?:se caracteriza por|se caracterizan por|presenta|presentan|posee|poseen)\s+(.{18,190})$/i},
    {type:'composition',rx:/^(.{3,60}?)\s+(?:se compone de|se componen de|est[aá] formado por|est[aá]n formados por|contiene|contienen)\s+(.{18,190})$/i},
    {type:'cause',rx:/^(.{3,70}?)\s+(?:provoca|provocan|produce|producen|genera|generan|causa|causan|aumenta|aumentan|disminuye|disminuyen|favorece|favorecen)\s+(.{15,180})$/i}
  ];
  for(const raw of sentences){
    const s=quizCleanText(raw);
    if(quizJunk(s) || s.length<28 || s.length>260) continue;
    let match=null, type='';
    for(const p of patterns){
      const m=s.match(p.rx);
      if(m){ match=m; type=p.type; break; }
    }
    if(!match) continue;
    const concept=quizCleanText(match[1]).replace(/^(?:el|la|los|las|un|una)\s+/i,'');
    const detail=quizCleanText(match[2]);
    if(concept.length<3 || concept.length>60 || detail.length<15 || quizJunk(concept) || quizJunk(detail)) continue;
    const key=quizNorm(concept)+'|'+quizNorm(detail);
    if(seen.has(key)) continue;
    seen.add(key);
    facts.push({concept:cap(concept),detail,type,source:s});
  }
  return facts.slice(0,60);
}
function quizConceptGroups(facts){
  const map=new Map();
  for(const f of facts){
    const k=quizNorm(f.concept);
    if(!map.has(k)) map.set(k,{concept:f.concept,facts:[]});
    const g=map.get(k);
    if(!g.facts.some(x=>quizNorm(x.detail)===quizNorm(f.detail))) g.facts.push(f);
  }
  return [...map.values()];
}
function quizKey(q){
  return quizNorm(q||'');
}
function quizOptionSet(options){
  const seen=new Set();
  for(const o of options){
    const k=quizNorm(o);
    if(!k || seen.has(k)) return false;
    seen.add(k);
  }
  return seen.size===4;
}
function stableHash(s){
  let h=2166136261;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return h>>>0;
}
function shuffledQuestion(question, correct, distractors){
  const options=[correct,...distractors].map(x=>quizShort(x,150));
  if(!quizOptionSet(options)) return null;
  let seed=stableHash(question+'|'+correct);
  const arr=options.map((v,i)=>({v,i}));
  for(let i=arr.length-1;i>0;i--){
    seed=(Math.imul(seed,1664525)+1013904223)>>>0;
    const j=seed%(i+1);
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  const shuffled=arr.map(x=>x.v);
  const correctShown=quizShort(correct,150);
  return {question,options:shuffled,correctIndex:shuffled.indexOf(correctShown),selected:null};
}
function pushUniqueQuiz(qs,seen,q){
  if(!q) return false;
  const key=quizKey(q.question);
  if(!key || seen.has(key)) return false;
  seen.add(key);
  qs.push(q);
  return true;
}
function pickDifferentFacts(facts, current, count=3, sameType=true){
  let pool=facts.filter(x=>quizNorm(x.concept)!==quizNorm(current.concept) && quizNorm(x.detail)!==quizNorm(current.detail));
  if(sameType){
    const typed=pool.filter(x=>x.type===current.type);
    if(typed.length>=count) pool=typed;
  }
  // Prioriza opciones de longitud parecida para que la respuesta correcta no "salte a la vista".
  return pool.sort((a,b)=>Math.abs(a.detail.length-current.detail.length)-Math.abs(b.detail.length-current.detail.length)).slice(0,count);
}
function questionStem(kind,concept,detail,idx){
  const c=concept, d=quizShort(detail,110);
  const sets={
    identify:[
      `Una definición de la materia describe “${d}”. ¿A qué concepto corresponde?`,
      `¿Qué concepto explica mejor la siguiente descripción: “${d}”?`,
      `Si tuvieras que asociar “${d}” con un concepto estudiado, ¿cuál elegirías?`
    ],
    meaning:[
      `Respecto de ${c}, ¿cuál de las siguientes afirmaciones es correcta según la materia?`,
      `¿Qué opción describe con mayor precisión a ${c}?`,
      `¿Cuál afirmación corresponde específicamente a ${c} y no a otro concepto del tema?`
    ],
    application:[
      `En un ejercicio aparece la situación “${d}”. ¿Qué concepto permite interpretarla correctamente?`,
      `Durante el estudio se observa “${d}”. ¿Con qué concepto se relaciona de forma más directa?`,
      `¿Qué concepto sería el más adecuado para explicar “${d}”?`
    ]
  };
  const a=sets[kind]||sets.identify;
  return a[idx%a.length];
}
function buildAssociationQuestion(facts, offset=0, exceptMode=false){
  if(facts.length<4) return null;
  const base=facts[offset%facts.length];
  const other=pickDifferentFacts(facts,base,3,false);
  if(other.length<3) return null;
  if(!exceptMode){
    const correct=`${base.concept} — ${quizShort(base.detail,92)}`;
    const wrong=other.map((f,i)=>{
      const next=other[(i+1)%other.length];
      return `${f.concept} — ${quizShort(next.detail,92)}`;
    });
    return shuffledQuestion(
      '¿Cuál de las siguientes asociaciones concepto–descripción es correcta según el material estudiado?',
      correct, wrong
    );
  }
  // 3 asociaciones reales + 1 asociación cruzada. La cruzada es la respuesta a EXCEPTO.
  const trueFacts=[base,...other.slice(0,2)];
  const trueOpts=trueFacts.map(f=>`${f.concept} — ${quizShort(f.detail,92)}`);
  const wrongConcept=other[2].concept;
  const wrongDetail=base.detail;
  const wrong=`${wrongConcept} — ${quizShort(wrongDetail,92)}`;
  return shuffledQuestion(
    'Todas las siguientes asociaciones son correctas según la materia, EXCEPTO:',
    wrong, trueOpts
  );
}
function buildCauseQuestion(causeFacts, allFacts, idx){
  const f=causeFacts[idx%causeFacts.length];
  const wrong=pickDifferentFacts(allFacts,f,3,false).map(x=>quizShort(x.detail,115));
  if(wrong.length<3) return null;
  const stems=[
    `Según la relación causal presentada en la materia, si ocurre ${f.concept}, ¿qué consecuencia se espera?`,
    `¿Cuál es el efecto que el material asocia directamente con ${f.concept}?`,
    `Si ${f.concept} estuviera presente en una situación de aplicación, ¿qué resultado sería coherente con lo estudiado?`
  ];
  return shuffledQuestion(stems[idx%stems.length],quizShort(f.detail,115),wrong);
}
function generateLocalQuiz(cls){
  const text=cleanStudySource(sourceTextForClass(cls));
  if(text.length<80) return [];

  const facts=quizFacts(text);
  const groups=quizConceptGroups(facts);
  if(facts.length<2 || groups.length<2) return [];

  const qs=[], seenQ=new Set();
  const usableFacts=facts.filter(f=>f.detail.length>=18 && f.detail.length<=190);
  const strongFacts=usableFacts.filter(f=>pickDifferentFacts(usableFacts,f,3,true).length>=3);
  const broadFacts=usableFacts.filter(f=>pickDifferentFacts(usableFacts,f,3,false).length>=3);

  // A. Reconocimiento conceptual: máximo 6.
  for(let i=0;i<broadFacts.length && qs.length<6;i++){
    const f=broadFacts[i];
    const distractors=pickDifferentFacts(broadFacts,f,3,false).map(x=>x.concept);
    const q=shuffledQuestion(questionStem('identify',f.concept,f.detail,i),f.concept,distractors);
    pushUniqueQuiz(qs,seenQ,q);
  }

  // B. Comprensión precisa: definiciones/funciones similares como distractores. Máximo 6.
  let target=12;
  for(let i=0;i<strongFacts.length && qs.length<target;i++){
    const f=strongFacts[i];
    const distractors=pickDifferentFacts(strongFacts,f,3,true).map(x=>quizShort(x.detail,120));
    const q=shuffledQuestion(questionStem('meaning',f.concept,f.detail,i),quizShort(f.detail,120),distractors);
    pushUniqueQuiz(qs,seenQ,q);
  }

  // C. Aplicación contextual: no copia textual del enunciado como pregunta. Máximo 5.
  target=17;
  for(let i=0;i<broadFacts.length && qs.length<target;i++){
    const f=broadFacts[(i*2+1)%broadFacts.length];
    const distractors=pickDifferentFacts(broadFacts,f,3,false).map(x=>x.concept);
    const q=shuffledQuestion(questionStem('application',f.concept,f.detail,i),f.concept,distractors);
    pushUniqueQuiz(qs,seenQ,q);
  }

  // D. Asociación cruzada y preguntas EXCEPTO: más capciosas, pero siempre basadas en el material.
  target=23;
  for(let i=0;i<usableFacts.length && qs.length<target;i++){
    pushUniqueQuiz(qs,seenQ,buildAssociationQuestion(usableFacts,i,false));
    if(qs.length<target) pushUniqueQuiz(qs,seenQ,buildAssociationQuestion(usableFacts,i+2,true));
  }

  // E. Causa → efecto cuando el material contiene relaciones causales explícitas.
  const causes=usableFacts.filter(f=>f.type==='cause');
  target=27;
  for(let i=0;i<causes.length && qs.length<target;i++){
    pushUniqueQuiz(qs,seenQ,buildCauseQuestion(causes,usableFacts,i));
  }

  // F. Completa hasta 30 SOLO con preguntas de buena calidad; nunca rellena con genéricas.
  for(let i=6;i<broadFacts.length && qs.length<30;i++){
    const f=broadFacts[i];
    const distractors=pickDifferentFacts(broadFacts,f,3,false).map(x=>x.concept);
    pushUniqueQuiz(qs,seenQ,shuffledQuestion(
      `¿Cuál de estos conceptos NO debería confundirse con los demás si la descripción clave es “${quizShort(f.detail,105)}”?`,
      f.concept,distractors
    ));
  }

  // Si hay poca materia, entrega menos preguntas. Nunca supera 30.
  return qs.slice(0,30);
}

/* ---------- Audio: guardado local (IndexedDB) ---------- */
const AUDIO_DB_NAME = 'fractal_notebook_audio';
function openAudioDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB no disponible')); return; }
    const req = indexedDB.open(AUDIO_DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('recordings'); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
const FILES_DB_NAME = 'fractal_notebook_files';
function openFilesDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB no disponible')); return; }
    const req = indexedDB.open(FILES_DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('files'); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function saveFileBlob(id, blob){
  const db = await openFilesDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('files','readwrite');
    tx.objectStore('files').put(blob, id);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  });
}
async function getFileBlob(id){
  const db = await openFilesDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('files','readonly');
    const req = tx.objectStore('files').get(id);
    req.onsuccess = ()=>resolve(req.result||null);
    req.onerror = ()=>reject(req.error);
  });
}
async function deleteFileBlob(id){
  try{
    const db = await openFilesDB();
    return new Promise((resolve)=>{
      const tx = db.transaction('files','readwrite');
      tx.objectStore('files').delete(id);
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>resolve(false);
    });
  }catch(e){ return false; }
}

}

}

function formatBytes(n){ if(!n) return '0 KB'; if(n<1024*1024) return Math.round(n/1024)+' KB'; return (n/1024/1024).toFixed(1)+' MB'; }
function formatDuration(s){ s=s||0; const m=Math.floor(s/60), r=s%60; return `${m}:${String(r).padStart(2,'0')}`; }
async function playClassAudio(classId){
  const host = document.getElementById('audioPlayerHost');
  if(!host) return;
  host.innerHTML = '<div class="empty" style="padding:8px 0;">Cargando audio…</div>';
  try{
    const blob = await getAudioBlob(classId);
    if(!blob){ host.innerHTML = '<div class="empty" style="padding:8px 0;">No se encontró el audio guardado.</div>'; return; }
    const url = URL.createObjectURL(blob);
    host.innerHTML = `<audio controls autoplay style="width:100%;margin-top:8px;" src="${url}"></audio>`;
  }catch(e){ host.innerHTML = '<div class="warn">No se pudo cargar el audio.</div>'; }
}
/* ---------- Transcripción local con Whisper (en el propio celular, sin servidor) ---------- */
let whisperPipelinePromise = null;
async function getWhisperPipeline(onProgress){
  if(!whisperPipelinePromise){
    whisperPipelinePromise = (async ()=>{
      const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
      return await pipeline('automatic-speech-recognition', 'Xenova/whisper-base', {
        progress_callback: (p)=>{
          if(onProgress && p && p.status==='progress'){ onProgress(Math.round(p.progress||0)); }
        }
      });
    })();
  }
  return whisperPipelinePromise;
}
async function transcribeStoredAudio(subId, classId){
  const sub = getSubject(subId), cls = getClass(sub, classId);
  const btn = document.getElementById('localTranscribeBtn');
  if(!cls || !cls.audio){ alert('No hay audio guardado para esta clase.'); return; }
  if(btn){ btn.disabled=true; btn.textContent='Preparando…'; }
  try{
    const blob = await getAudioBlob(classId);
    if(!blob){ alert('No se encontró el audio guardado.'); return; }
    const transcriber = await getWhisperPipeline((pct)=>{ if(btn) btn.textContent = `Descargando modelo… ${pct}%`; });
    if(btn) btn.textContent = 'Transcribiendo… puede tardar varios minutos';
    const url = URL.createObjectURL(blob);
    let result;
    try{
      result = await transcriber(url, {
        language: 'spanish', task: 'transcribe',
        chunk_length_s: 30, stride_length_s: 5,
        return_timestamps: true
      });
    } finally {
      URL.revokeObjectURL(url);
    }
    let entries = [];
    if(result && result.chunks && result.chunks.length){
      entries = result.chunks
        .map(c=>({ time: formatDuration(Math.round((c.timestamp && c.timestamp[0]) || 0)), text: cleanWhisperText(c.text||'') }))
        .filter(e=>e.text);
    } else if(result && result.text){
      entries = [{ time:'0:00', text: cleanWhisperText(result.text||'') }].filter(e=>e.text);
    }
    if(entries.length===0){ alert('No se pudo extraer texto de este audio.'); return; }
    cls.transcript = entries;
    persist(true);
  }catch(e){
    console.error('Error transcribiendo localmente:', e);
    alert('No se pudo transcribir en el celular: '+((e&&e.message)||'error desconocido')+'. Si el problema persiste, puede que tu navegador no soporte esta función todavía.');
  }finally{
    render();
  }
}

async function deleteClassAudio(subId,classId){
  if(!confirm('¿Eliminar el audio guardado de esta clase?')) return;
  await deleteAudioBlob(classId);
  const cls = getClass(getSubject(subId), classId);
  if(cls){ delete cls.audio; delete cls.driveFileId; delete cls.driveSavedAt; }
  persist(true); render();
}

/* ---------- Visor de archivos (sin descargar) ---------- */
async function viewFile(subId,classId,fileId){
  const sub = getSubject(subId), cls = getClass(sub,classId);
  const file = (cls.files||[]).find(f=>f.id===fileId);

    } else if(file.kind==='image'){

    }
  }catch(e){
    console.error('Error mostrando archivo:', e);

let recTimerInt=null, recSeconds=0, recPaused=false, recError=null;
let mediaRecorder=null, mediaChunks=[], mediaStream=null;
let liveAudioCtx=null, liveSource=null, liveProcessor=null, liveSilentGain=null;
let livePcmChunks=[], livePcmSamples=0, liveSampleRate=48000;
let liveTranscribeTimer=null, liveWorker=null, liveWorkerReady=false, liveWorkerBusy=false, livePendingForce=false;
let liveWorkerCls=null, liveBlockStartSec=0, liveWorkerJobStartedAt=0, liveWorkerWatchdog=null;
let liveOverlapTail=null, liveInFlightRaw=null, liveInFlightRate=0;
const LIVE_BLOCK_MS=6000, LIVE_MIN_SECONDS=4.5, LIVE_JOB_TIMEOUT_MS=22000, LIVE_OVERLAP_SECONDS=1.0;
function supportsSpeech(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && (window.AudioContext || window.webkitAudioContext) && window.Worker); }
function fmtTime(){ const d=new Date(); return d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}); }
function updateLiveTranscriptStatus(text){ const el=document.getElementById('liveTranscribeStatus'); if(el) el.textContent=text||''; }
function joinFloat32(chunks,total){ const out=new Float32Array(total); let pos=0; for(const c of chunks){ out.set(c,pos); pos+=c.length; } return out; }
function resampleTo16k(input,inputRate){
  if(inputRate===16000) return input;
  const ratio=inputRate/16000, outLen=Math.max(1,Math.round(input.length/ratio)), out=new Float32Array(outLen);
  for(let i=0;i<outLen;i++){
    const pos=i*ratio, left=Math.floor(pos), right=Math.min(input.length-1,left+1), frac=pos-left;
    out[i]=(input[left]||0)*(1-frac)+(input[right]||0)*frac;
  }
  return out;
}
function cleanWhisperText(text){
  let t=(text||'').replace(/\s+/g,' ').trim();
  if(!t) return '';
  const low=t.toLowerCase();
  const hallucinations=[
    /^gracias( por ver| por escuchar| a todos)?[.!]?$/i,
    /^suscr[ií]bete( al canal)?[.!]?$/i,
    /^subt[ií]tulos.*$/i,
    /^m[uú]sica[.!]?$/i,
    /^silencio[.!]?$/i,
    /^thank you.*$/i,
    /^www\..*$/i,
    /^(eh|ah|mmm|mm|uh)[,.! ]*$/i
  ];
  if(hallucinations.some(r=>r.test(t))) return '';
  const words=t.split(/\s+/).filter(Boolean);
  if(words.length<2) return '';
  const norm=words.map(w=>w.toLowerCase().replace(/[^a-záéíóúñü0-9]/gi,'')).filter(Boolean);
  if(norm.length<2) return '';
  const uniq=new Set(norm).size;
  if(norm.length>=5 && uniq/Math.max(1,norm.length)<0.38) return '';
  // Descarta frases donde una misma palabra domina el bloque, patrón típico de alucinación.
  const counts={}; let max=0;
  for(const w of norm){ counts[w]=(counts[w]||0)+1; if(counts[w]>max) max=counts[w]; }
  if(norm.length>=6 && max/norm.length>0.45) return '';
  return t;
}
function audioRms(pcm){
  if(!pcm || !pcm.length) return 0;
  let sum=0, n=0; for(let i=0;i<pcm.length;i+=4){ const v=pcm[i]; sum+=v*v; n++; }
  return Math.sqrt(sum/Math.max(1,n));
}
function speechActivity(pcm,rate){
  if(!pcm||!pcm.length) return {rms:0,peak:0,active:0};
  const frame=Math.max(1,Math.floor((rate||48000)*0.02));
  let sum=0,peak=0,total=0,active=0;
  for(let i=0;i<pcm.length;i+=frame){
    let fs=0,n=0,fp=0;
    const e=Math.min(pcm.length,i+frame);
    for(let j=i;j<e;j+=2){ const v=pcm[j]; fs+=v*v; fp=Math.max(fp,Math.abs(v)); n++; }
    const fr=Math.sqrt(fs/Math.max(1,n));
    sum+=fr*fr; peak=Math.max(peak,fp); total++;
    if(fr>0.010) active++;
  }
  return {rms:Math.sqrt(sum/Math.max(1,total)),peak,active:active/Math.max(1,total)};
}
function mergeTranscriptOverlap(previous,current){
  let cur=(current||'').trim();
  if(!previous||!cur) return cur;
  const a=previous.trim().split(/\s+/), b=cur.split(/\s+/);
  const norm=w=>w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9ñü]/g,'');
  const max=Math.min(10,a.length,b.length);
  for(let n=max;n>=2;n--){
    let ok=true;
    for(let i=0;i<n;i++){ if(norm(a[a.length-n+i])!==norm(b[i])){ok=false;break;} }
    if(ok) return b.slice(n).join(' ').trim();
  }
  return cur;
}
function createLiveWhisperWorker(){
  if(liveWorker) return liveWorker;
  const source = `
    let transcriber=null;
    async function ensure(){
      if(transcriber) return transcriber;
      const mod=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
      transcriber=await mod.pipeline('automatic-speech-recognition','Xenova/whisper-base',{progress_callback:(p)=>{
        if(p && p.status==='progress') self.postMessage({type:'progress',progress:Math.round(p.progress||0)});
      }});
      self.postMessage({type:'ready'});
      return transcriber;
    }
    self.onmessage=async(e)=>{
      const m=e.data||{};
      if(m.type==='init'){
        try{ await ensure(); }catch(err){ self.postMessage({type:'error',message:String(err&&err.message||err)}); }
      } else if(m.type==='transcribe'){
        try{
          const t=await ensure();
          const pcm=new Float32Array(m.buffer);
          const result=await t(pcm,{language:'spanish',task:'transcribe',temperature:0,return_timestamps:false,no_repeat_ngram_size:3,repetition_penalty:1.15,num_beams:2});
          self.postMessage({type:'result',text:(result&&result.text)||'',stamp:m.stamp||'00:00'});
        }catch(err){ self.postMessage({type:'blockError',message:String(err&&err.message||err)}); }
      }
    };
  `;
  const blob=new Blob([source],{type:'text/javascript'});
  liveWorker=new Worker(URL.createObjectURL(blob),{type:'module'});
  liveWorker.onmessage=(e)=>{
    const m=e.data||{};
    if(m.type==='progress') updateLiveTranscriptStatus(`Preparando IA local… ${m.progress}%`);
    else if(m.type==='ready'){
      liveWorkerReady=true;
      updateLiveTranscriptStatus(recPaused?'En pausa':'Transcripción activa');
      if(liveWorkerCls) flushLiveTranscription(liveWorkerCls).catch(()=>{});
    } else if(m.type==='result'){
      liveWorkerBusy=false; liveWorkerJobStartedAt=0; clearTimeout(liveWorkerWatchdog);
      liveInFlightRaw=null; liveInFlightRate=0;
      const cls=liveWorkerCls;
      let text=cleanWhisperText(m.text||'');
      if(cls && text){
        cls.transcript=cls.transcript||[];
        const last=cls.transcript.length?cls.transcript[cls.transcript.length-1]:null;
        text=mergeTranscriptOverlap(last&&last.text,text);
        if(text && (!last || last.text.toLowerCase()!==text.toLowerCase())){
          cls.transcript.push({time:m.stamp||'00:00',text});
          persist(); renderClassTranscript();
        }
      }
      updateLiveTranscriptStatus(recPaused?'En pausa':(cls&&cls.recording?'Transcripción activa · escuchando…':'Transcripción finalizada'));
      if(cls && (livePcmSamples>0 || livePendingForce)){
        const force=livePendingForce; livePendingForce=false;
        setTimeout(()=>flushLiveTranscription(cls,force).catch(()=>{}),0);
      }
    } else if(m.type==='blockError'){
      liveWorkerBusy=false; liveWorkerJobStartedAt=0; clearTimeout(liveWorkerWatchdog);
      if(liveInFlightRaw&&liveInFlightRaw.length){ livePcmChunks.unshift(liveInFlightRaw); livePcmSamples+=liveInFlightRaw.length; }
      liveInFlightRaw=null; liveInFlightRate=0;
      updateLiveTranscriptStatus('Grabando · reintentando transcripción…');
    } else if(m.type==='error'){
      liveWorkerBusy=false; liveWorkerReady=false;
      recError='La grabación funciona, pero no se pudo preparar la transcripción local.';
      render();
    }
  };
  liveWorker.onerror=(e)=>{ console.error('Worker Whisper:',e); liveWorkerBusy=false; liveWorkerReady=false; };
  liveWorker.postMessage({type:'init'});
  return liveWorker;
}
async function beginLiveLocalTranscription(cls){
  if(!supportsSpeech()){
    recError='Este dispositivo no permite la transcripción local en vivo. El audio seguirá grabándose y podrás transcribirlo al finalizar.';
    render(); return;
  }
  try{
    liveWorkerCls=cls; liveWorkerReady=false; liveWorkerBusy=false; livePendingForce=false;
    const AC=window.AudioContext||window.webkitAudioContext;
    liveAudioCtx=new AC();
    try{ await liveAudioCtx.resume(); }catch(e){}
    liveSampleRate=liveAudioCtx.sampleRate||48000;
    liveSource=liveAudioCtx.createMediaStreamSource(mediaStream);
    liveProcessor=liveAudioCtx.createScriptProcessor(4096,1,1);
    liveSilentGain=liveAudioCtx.createGain(); liveSilentGain.gain.value=0;
    livePcmChunks=[]; livePcmSamples=0; liveBlockStartSec=0; liveOverlapTail=null; liveInFlightRaw=null; liveInFlightRate=0;
    liveProcessor.onaudioprocess=(ev)=>{
      if(!cls.recording || recPaused) return;
      const data=ev.inputBuffer.getChannelData(0);
      const copy=new Float32Array(data.length); copy.set(data);
      livePcmChunks.push(copy); livePcmSamples+=copy.length;
    };
    liveSource.connect(liveProcessor); liveProcessor.connect(liveSilentGain); liveSilentGain.connect(liveAudioCtx.destination);
    updateLiveTranscriptStatus('Preparando transcripción local…');
    createLiveWhisperWorker();
    liveTranscribeTimer=setInterval(()=>{ flushLiveTranscription(cls).catch(()=>{}); },LIVE_BLOCK_MS);
  }catch(e){
    console.error('Captura PCM:',e);
    recError='La grabación continúa, pero este navegador no pudo preparar la transcripción en vivo.';
    render();
  }
}
async function flushLiveTranscription(cls,force=false){
  if(!cls) return;
  if(liveWorkerBusy){ if(force) livePendingForce=true; return; }
  if(livePcmSamples===0) return;
  if(!liveWorkerReady && !force) return;
  if(!force && livePcmSamples < liveSampleRate*LIVE_MIN_SECONDS) return;
  const chunks=livePcmChunks, total=livePcmSamples;
  livePcmChunks=[]; livePcmSamples=0;
  const fresh=joinFloat32(chunks,total);
  const tailCount=Math.min(fresh.length,Math.floor(liveSampleRate*LIVE_OVERLAP_SECONDS));
  const nextTail=tailCount?fresh.slice(fresh.length-tailCount):null;
  let rawPcm=fresh;
  if(liveOverlapTail&&liveOverlapTail.length){
    const joined=new Float32Array(liveOverlapTail.length+fresh.length);
    joined.set(liveOverlapTail,0); joined.set(fresh,liveOverlapTail.length); rawPcm=joined;
  }
  liveOverlapTail=nextTail;
  const va=speechActivity(rawPcm,liveSampleRate);
  if(va.rms < 0.010 || va.peak < 0.025 || va.active < 0.12){
    updateLiveTranscriptStatus(recPaused?'En pausa':'Escuchando…');
    return;
  }
  const pcm=resampleTo16k(rawPcm,liveSampleRate);
  const segSec=Math.round(total/liveSampleRate);
  const current=Math.max(0,(cls.recSeconds||recSeconds)-segSec);
  const stamp=formatDuration(current);
  try{
    liveWorkerBusy=true; liveWorkerJobStartedAt=Date.now();
    liveInFlightRaw=fresh; liveInFlightRate=liveSampleRate;
    clearTimeout(liveWorkerWatchdog);
    liveWorkerWatchdog=setTimeout(()=>{
      if(!liveWorkerBusy) return;
      console.warn('Whisper tardó demasiado; reiniciando worker para no congelar la transcripción.');
      try{ if(liveWorker) liveWorker.terminate(); }catch(e){}
      liveWorker=null; liveWorkerReady=false; liveWorkerBusy=false; liveWorkerJobStartedAt=0;
      if(liveInFlightRaw&&liveInFlightRaw.length){ livePcmChunks.unshift(liveInFlightRaw); livePcmSamples+=liveInFlightRaw.length; }
      liveInFlightRaw=null; liveInFlightRate=0;
      updateLiveTranscriptStatus('Reiniciando transcripción…');
      try{ createLiveWhisperWorker(); }catch(e){ console.error(e); }
    },LIVE_JOB_TIMEOUT_MS);
    updateLiveTranscriptStatus('Transcribiendo…');
    const w=createLiveWhisperWorker();
    w.postMessage({type:'transcribe',buffer:pcm.buffer,stamp},[pcm.buffer]);
  }catch(e){
    liveWorkerBusy=false;
    console.error('No se pudo enviar bloque a Whisper:',e);
  }
}
async function endLiveLocalTranscription(cls,flush=true){
  clearInterval(liveTranscribeTimer); liveTranscribeTimer=null;
  if(liveProcessor){ try{liveProcessor.disconnect();}catch(e){} liveProcessor.onaudioprocess=null; liveProcessor=null; }
  if(liveSource){ try{liveSource.disconnect();}catch(e){} liveSource=null; }
  if(liveSilentGain){ try{liveSilentGain.disconnect();}catch(e){} liveSilentGain=null; }
  if(liveAudioCtx){ try{await liveAudioCtx.close();}catch(e){} liveAudioCtx=null; }
  // No bloqueamos el botón Finalizar esperando a Whisper. El último bloque se procesa en segundo plano.
  if(flush && livePcmSamples){
    if(liveWorkerBusy) livePendingForce=true;
    else flushLiveTranscription(cls,true).catch(()=>{});
  }
}
async function startRecording(sub, cls){
  recError=null;
  try{
    mediaStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    mediaChunks=[];
    const preferred=['audio/webm;codecs=opus','audio/webm','audio/mp4'];
    const mime=preferred.find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x));
    mediaRecorder=mime?new MediaRecorder(mediaStream,{mimeType:mime}):new MediaRecorder(mediaStream);
    mediaRecorder.ondataavailable=(e)=>{ if(e.data&&e.data.size>0) mediaChunks.push(e.data); };
    mediaRecorder.onerror=(e)=>{ console.error('MediaRecorder:',e); recError='Ocurrió un problema guardando el audio.'; render(); };
    mediaRecorder.start(1000);
  }catch(e){
    console.error('No se pudo iniciar la grabación:',e);
    recError='No se pudo acceder al micrófono. Revisa el permiso del micrófono para Fractal Notebook.';
    render(); return;
  }
  cls.recording=true; cls.recSeconds=0; recSeconds=0; recPaused=false;
  recTimerInt=setInterval(()=>{ if(!recPaused){ recSeconds++; cls.recSeconds=recSeconds; updateRecTime(); } },1000);
  render();
  beginLiveLocalTranscription(cls).catch(()=>{});
}
function pauseRecording(){

function resumeRecording(subId,classId){

function stopRecording(sub,cls){
  if(!cls || !cls.recording) return;
  // La interfaz responde de inmediato, aunque Whisper esté procesando un bloque.
  cls.recording=false; recPaused=false; clearInterval(recTimerInt); recTimerInt=null;
  const recorder=mediaRecorder;
  const recorderMime=(recorder&&recorder.mimeType)||'audio/webm';
  mediaRecorder=null;
  if(mediaStream){ try{mediaStream.getTracks().forEach(t=>t.stop());}catch(e){} mediaStream=null; }
  endLiveLocalTranscription(cls,true).catch(()=>{});
  persist(true); render();
  if(recorder&&recorder.state!=='inactive'){
    recorder.onstop=async()=>{
      try{
        const blob=new Blob(mediaChunks,{type:recorderMime}); mediaChunks=[];
        await saveAudioBlob(cls.id,blob);

        persist(true); render();

    };
    try{ recorder.stop(); }catch(e){ console.error('Detener recorder:',e); }
  }
}

    const existing=document.querySelector('script[data-fractal-gis="1"]');
    if(existing){ existing.addEventListener('load',()=>resolve(),{once:true}); existing.addEventListener('error',()=>reject(new Error('GIS_LOAD_FAILED')),{once:true}); return; }
    const s=document.createElement('script');
    s.src='https://accounts.google.com/gsi/client';
    s.async=true; s.defer=true; s.dataset.fractalGis='1';
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('GIS_LOAD_FAILED'));
    document.head.appendChild(s);
  });
}

function validateDriveClientId(clientId){
  return /^\d+-[a-z0-9_-]+\.apps\.googleusercontent\.com$/i.test((clientId||'').trim());
}

function clearDriveSession(revoke){
  const token=driveAccessToken;
  driveAccessToken=null;
  driveTokenResponse=null;
  driveTokenClient=null;
  if(revoke && token && window.google?.accounts?.oauth2?.revoke){
    try{ google.accounts.oauth2.revoke(token,()=>{}); }catch(e){}
  }
}

function getDriveAccessToken(forceConsent=false){
  return new Promise((resolve,reject)=>{
    const clientId=getEmbeddedDriveClientId();
    if(!clientId){ reject(new Error('NO_CLIENT_ID')); return; }
    try{
      if(!driveTokenClient){
        driveTokenClient = google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: DRIVE_SCOPE,
          include_granted_scopes: true,
          callback: ()=>{},
          error_callback: (err)=>{
            const e=new Error((err&&err.type)||'OAUTH_POPUP_ERROR');
            e.oauth=err; reject(e);
          }
        });
      }
      driveTokenClient.callback = (resp)=>{
        if(!resp){ reject(new Error('EMPTY_OAUTH_RESPONSE')); return; }
        if(resp.error){
          const e=new Error(resp.error_description||resp.error);
          e.oauth=resp; reject(e); return;
        }
        if(!resp.access_token){ reject(new Error('NO_ACCESS_TOKEN')); return; }
        // Confirma que el permiso de Drive solicitado fue efectivamente concedido.
        try{
          if(google.accounts.oauth2.hasGrantedAllScopes && !google.accounts.oauth2.hasGrantedAllScopes(resp, DRIVE_SCOPE)){
            reject(new Error('DRIVE_SCOPE_NOT_GRANTED')); return;
          }
        }catch(e){}
        driveTokenResponse=resp;
        driveAccessToken=resp.access_token;
        resolve(driveAccessToken);
      };
      driveTokenClient.requestAccessToken({prompt: forceConsent ? 'consent' : ''});
    }catch(err){ reject(err); }
  });
}



/* ---------- Conversión local de audio a MP3 para Google Drive ---------- */
let lameJsPromise=null;
function loadLameJs(){
  if(window.lamejs) return Promise.resolve();
  if(lameJsPromise) return lameJsPromise;
  lameJsPromise = new Promise((resolve,reject)=>{
    const existing=document.querySelector('script[data-fractal-lamejs]');
    if(existing){
      existing.addEventListener('load',()=>resolve(),{once:true});
      existing.addEventListener('error',()=>reject(new Error('No se pudo cargar el conversor MP3')),{once:true});
      return;
    }
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js';
    s.async=true;
    s.dataset.fractalLamejs='1';
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error('No se pudo cargar el conversor MP3. Revisa tu conexión a internet.'));
    document.head.appendChild(s);
  });
  return lameJsPromise;
}

function floatTo16BitPCM(float32){
  const out=new Int16Array(float32.length);
  for(let i=0;i<float32.length;i++){
    const v=Math.max(-1,Math.min(1,float32[i]));
    out[i]=v<0 ? v*0x8000 : v*0x7fff;
  }
  return out;
}

async function convertAudioBlobToMp3(blob, onProgress){
  await loadLameJs();
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtx) throw new Error('Este navegador no permite convertir audio a MP3.');
  const ctx=new AudioCtx();
  try{
    const arr=await blob.arrayBuffer();
    const audioBuffer=await ctx.decodeAudioData(arr.slice(0));
    const sampleRate=audioBuffer.sampleRate;
    const channels=Math.min(2,audioBuffer.numberOfChannels||1);
    const left=floatTo16BitPCM(audioBuffer.getChannelData(0));
    const right=channels===2 ? floatTo16BitPCM(audioBuffer.getChannelData(1)) : null;
    const kbps=128;
    const encoder=new lamejs.Mp3Encoder(channels,sampleRate,kbps);
    const blockSize=1152;
    const parts=[];
    const total=left.length;
    for(let i=0;i<total;i+=blockSize){
      const l=left.subarray(i,Math.min(i+blockSize,total));
      let mp3buf;
      if(channels===2){
        const r=right.subarray(i,Math.min(i+blockSize,total));
        mp3buf=encoder.encodeBuffer(l,r);
      }else{
        mp3buf=encoder.encodeBuffer(l);
      }
      if(mp3buf.length) parts.push(new Uint8Array(mp3buf));
      if(onProgress && i%(blockSize*40)===0) onProgress(Math.min(99,Math.round((i/total)*100)));
      if(i%(blockSize*80)===0) await new Promise(r=>setTimeout(r,0));
    }
    const end=encoder.flush();
    if(end.length) parts.push(new Uint8Array(end));
    if(onProgress) onProgress(100);
    return new Blob(parts,{type:'audio/mpeg'});
  }finally{
    try{ await ctx.close(); }catch(e){}
  }
}

async function driveMultipartUpload(blob, fileName, token){
  const boundary='fractal_'+Math.random().toString(36).slice(2)+Date.now();
  const metadata={name:fileName};
  const mime=blob.type || 'application/octet-stream';
  const body=new Blob([
    `--${boundary}\r\n`,
    'Content-Type: application/json; charset=UTF-8\r\n\r\n',
    JSON.stringify(metadata),
    `\r\n--${boundary}\r\n`,
    `Content-Type: ${mime}\r\n\r\n`,
    blob,
    `\r\n--${boundary}--`
  ]);
  const res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink',{
    method:'POST',
    headers:{
      'Authorization':'Bearer '+token,
      'Content-Type':`multipart/related; boundary=${boundary}`
    },
    body
  });
  let data=null;
  try{ data=await res.json(); }catch(e){}
  if(!res.ok){
    const msg=data?.error?.message || `Google Drive respondió ${res.status}`;
    const err=new Error(msg);
    err.status=res.status;
    err.drive=data;
    throw err;
  }
  return data;
}

async function uploadToGoogleDrive(sub,cls){
  if(!getEmbeddedDriveClientId()){ openModal('driveSetup'); return; }
  const btn=document.getElementById('driveBtn');
  if(btn){ btn.disabled=true; btn.textContent='Conectando con Drive…'; }
  try{
    await loadGisScript();
    const originalBlob=await getAudioBlob(cls.id);
    if(!originalBlob){ alert('No hay audio guardado para esta clase.'); return; }

    if(btn) btn.textContent='Convirtiendo a MP3…';
    const blob=await convertAudioBlobToMp3(originalBlob,(pct)=>{
      if(btn) btn.textContent=`Convirtiendo a MP3… ${pct}%`;
    });
    const fileName=`${sub.name} - ${cls.name}.mp3`;

    let token=await getDriveAccessToken(false);
    if(btn) btn.textContent='Subiendo MP3 a Drive…';
    let data;
    try{
      data=await driveMultipartUpload(blob,fileName,token);
    }catch(err){
      // Un 401 significa token inválido/expirado. Forzamos una sesión nueva y reintentamos una sola vez.
      if(err && err.status===401){
        clearDriveSession(true);
        if(btn) btn.textContent='Renovando acceso…';
        token=await getDriveAccessToken(true);
        if(btn) btn.textContent='Subiendo MP3 a Drive…';
        data=await driveMultipartUpload(blob,fileName,token);
      }else throw err;
    }

    cls.driveFileId=data.id;
    cls.driveFileName=data.name||fileName;
    cls.driveWebViewLink=data.webViewLink||null;
    cls.driveSavedAt=new Date().toLocaleString('es-CL');
    persist(true);
    render();
    alert('✓ Grabación convertida a MP3 y guardada correctamente en Google Drive.');
  }catch(e){
    console.error('Error subiendo a Drive:',e);
    if(e && e.message==='NO_CLIENT_ID'){
      openModal('driveSetup');

    }else if(e && e.message==='DRIVE_SCOPE_NOT_GRANTED'){
      alert('Google no concedió permiso para guardar archivos en Drive. Vuelve a conectar y acepta el permiso solicitado.');
      clearDriveSession(true);
    }else if(e && (e.message==='popup_failed_to_open' || e.message==='popup_closed')){
      alert('Google no pudo abrir la ventana de autorización. Permite ventanas emergentes para este sitio e inténtalo otra vez.');
    }else if(e && e.status===401){
      alert('Google Drive rechazó las credenciales incluso después de renovarlas. Revisa que el Client ID corresponda a una “Aplicación web”, que Drive API esté habilitada y que este dominio de Netlify esté agregado en “Orígenes de JavaScript autorizados”.');
      clearDriveSession(true);
    }else{
      alert('No se pudo subir a Google Drive: '+((e&&e.message)||'error desconocido'));
    }
  }finally{
    const b=document.getElementById('driveBtn');
    if(b){ b.disabled=false; b.textContent='☁️ Guardar en Drive'; }
  }
}

/* ---------- Exportar / descargar / Drive / ZIP de clase ---------- */
function safeFileName(name){
  return String(name||'archivo').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim().slice(0,120)||'archivo';
}
function classBaseName(sub,cls){ return safeFileName(`${sub.name} - ${cls.name}`); }
function quizAsText(cls){
  if(!cls.quiz || !cls.quiz.length) return '';
  const letters=['A','B','C','D','E','F'];
  const lines=[];
  cls.quiz.forEach((q,i)=>{
    lines.push(`${i+1}. ${q.question}`);
    (q.options||[]).forEach((o,j)=>lines.push(`   ${letters[j]||String(j+1)}. ${o}`));
    const ci=Number.isInteger(q.correctIndex)?q.correctIndex:0;
    lines.push(`   Respuesta correcta: ${letters[ci]||String(ci+1)}. ${(q.options||[])[ci]||''}`,'');
  });
  return lines.join('\n');
}
function transcriptAsText(cls){
  return (cls.transcript||[]).map(t=>`[${t.time||''}] ${t.text||''}`).join('\n');
}
function artifactText(type,sub,cls){
  const head=`${sub.name}\n${cls.name}${cls.date?` · ${cls.date}`:''}${cls.topic?`\nTema: ${cls.topic}`:''}\n\n`;
  if(type==='notes'){
    if(!cls.aiNotes) throw new Error('Primero genera el apunte de esta clase.');
    return head+'APUNTE GENERADO\n\n'+cls.aiNotes;
  }
  if(type==='quiz'){
    if(!cls.quiz || !cls.quiz.length) throw new Error('Primero genera el cuestionario de esta clase.');
    return head+`CUESTIONARIO (${cls.quiz.length} preguntas)\n\n`+quizAsText(cls);
  }
  throw new Error('Tipo de documento no válido');
}
function textToDocxParagraphs(text){
  if(!window.docx) throw new Error('No se pudo cargar el generador DOCX. Revisa tu conexión.');
  const D=window.docx, out=[];
  for(const raw of String(text||'').split(/\r?\n/)){
    const line=raw.trimEnd();
    if(!line){ out.push(new D.Paragraph('')); continue; }
    if(/^##\s+/.test(line)){
      out.push(new D.Paragraph({text:line.replace(/^##\s+/,''),heading:D.HeadingLevel.HEADING_2,spacing:{before:180,after:100}}));
    }else if(/^[A-ZÁÉÍÓÚÑÜ0-9 ()-]{4,}:?$/.test(line) && line.length<90){
      out.push(new D.Paragraph({text:line.replace(/:$/,''),heading:D.HeadingLevel.HEADING_1,spacing:{before:180,after:100}}));
    }else if(/^[-•]\s+/.test(line)){
      out.push(new D.Paragraph({text:line.replace(/^[-•]\s+/,''),bullet:{level:0}}));
    }else{
      out.push(new D.Paragraph({children:[new D.TextRun({text:line,size:22})],spacing:{after:100}}));
    }
  }
  return out;
}
async function textToDocxBlob(text,title){
  if(!window.docx) throw new Error('No se pudo cargar DOCX. Revisa tu conexión e inténtalo de nuevo.');
  const D=window.docx;
  const children=[new D.Paragraph({text:title,heading:D.HeadingLevel.TITLE,spacing:{after:220}}),...textToDocxParagraphs(text)];
  const doc=new D.Document({sections:[{properties:{},children}]});
  return await D.Packer.toBlob(doc);
}
function textToPdfBlob(text,title){
  if(!window.jspdf || !window.jspdf.jsPDF) throw new Error('No se pudo cargar el generador PDF. Revisa tu conexión.');
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({unit:'mm',format:'a4'});
  const margin=16, pageW=210, pageH=297, usable=pageW-margin*2;
  let y=18;
  function addLine(line,bold=false,size=11){
    pdf.setFont('helvetica',bold?'bold':'normal'); pdf.setFontSize(size);
    const wrapped=pdf.splitTextToSize(line||' ',usable);
    for(const w of wrapped){
      if(y>pageH-16){ pdf.addPage(); y=18; }
      pdf.text(w,margin,y); y+=size*0.43+2.2;
    }
  }
  addLine(title,true,16); y+=2;
  for(const raw of String(text||'').split(/\r?\n/)){
    const line=raw.trimEnd();
    if(!line){ y+=3; continue; }
    if(/^##\s+/.test(line)) addLine(line.replace(/^##\s+/,''),true,13);
    else if(/^[A-ZÁÉÍÓÚÑÜ0-9 ()-]{4,}:?$/.test(line) && line.length<90) addLine(line.replace(/:$/,''),true,13);
    else addLine(line,false,11);
  }
  return pdf.output('blob');
}
async function buildArtifactBlob(type,format,sub,cls){
  const text=artifactText(type,sub,cls);
  const label=type==='notes'?'Apunte':'Cuestionario';
  const title=`${label} · ${sub.name} · ${cls.name}`;
  if(format==='docx') return await textToDocxBlob(text,title);
  if(format==='pdf') return textToPdfBlob(text,title);
  throw new Error('Formato no válido');
}
function triggerDownload(blob,fileName){
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=fileName; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
async function downloadStudyArtifact(subId,classId,type,format){
  try{
    const sub=getSubject(subId), cls=getClass(sub,classId);
    const blob=await buildArtifactBlob(type,format,sub,cls);
    const label=type==='notes'?'Apunte':'Cuestionario';
    triggerDownload(blob,`${classBaseName(sub,cls)} - ${label}.${format}`);
  }catch(e){ alert((e&&e.message)||'No se pudo crear el archivo.'); }
}
async function uploadBlobToDriveWithRetry(blob,fileName,statusCb,preauthorizedToken){
  if(!getEmbeddedDriveClientId()) throw new Error('NO_CLIENT_ID');
  await loadGisScript();
  let token=preauthorizedToken || driveAccessToken;
  if(!token) token=await getDriveAccessToken(false);
  if(statusCb) statusCb('Subiendo a Drive…');
  try{ return await driveMultipartUpload(blob,fileName,token); }
  catch(err){
    if(err&&err.status===401){
      // No abrimos un popup OAuth después de una tarea larga (ZIP/PDF/DOCX),
      // porque Chrome móvil lo bloquea. Invalidamos la sesión y pedimos al
      // usuario que pulse de nuevo; en el siguiente toque la autorización
      // ocurre directamente desde el gesto del usuario.
      clearDriveSession(true);
      const e=new Error('DRIVE_SESSION_EXPIRED');
      e.status=401;
      throw e;
    }
    throw err;
  }
}

async function authorizeDriveFromUserGesture(statusCb){
  if(!getEmbeddedDriveClientId()) throw new Error('NO_CLIENT_ID');
  // Google Identity Services se precarga al iniciar la app. Si por una red
  // lenta aún no está disponible, intentamos cargarlo aquí.
  await loadGisScript();
  if(statusCb) statusCb('Conectando con Google…');
  return await getDriveAccessToken(false);
}

    else alert('No se pudo guardar en Drive: '+((e&&e.message)||'error desconocido'));
  }finally{ if(btn){btn.disabled=false;btn.textContent=old;} }
}
async function buildClassZip(sub,cls,onProgress){
  if(!window.JSZip) throw new Error('No se pudo cargar el generador ZIP.');
  const zip=new JSZip();
  const root=zip.folder(classBaseName(sub,cls));
  const info=[`Asignatura: ${sub.name}`,`Clase: ${cls.name}`,cls.date?`Fecha: ${cls.date}`:'',cls.topic?`Tema: ${cls.topic}`:''].filter(Boolean).join('\n');
  root.file('00 - Informacion de la clase.txt',info+'\n');
  const transcript=transcriptAsText(cls); if(transcript) root.file('01 - Transcripcion.txt',transcript);
  const student=stripHtml(cls.studentNotes||'').trim(); if(student) root.file('02 - Apuntes del estudiante.txt',student);
  if(cls.aiNotes){
    const nblob=await textToDocxBlob(artifactText('notes',sub,cls),`Apunte · ${sub.name} · ${cls.name}`);
    root.file('03 - Apunte generado.docx',nblob);
  }
  if(cls.quiz&&cls.quiz.length){
    const qblob=await textToDocxBlob(artifactText('quiz',sub,cls),`Cuestionario · ${sub.name} · ${cls.name}`);
    root.file(`04 - Cuestionario ${cls.quiz.length} preguntas.docx`,qblob);
  }
  const audio=await getAudioBlob(cls.id).catch(()=>null);
  if(audio){
    if(onProgress) onProgress('Convirtiendo grabación a MP3…');
    const mp3=await convertAudioBlobToMp3(audio,p=>{if(onProgress)onProgress(`Convirtiendo grabación… ${p}%`);});
    root.file('05 - Grabacion.mp3',mp3);
  }
  if((cls.files||[]).length){
    const mf=root.folder('Material de clase');
    for(const f of cls.files){
      const b=await getFileBlob(f.id).catch(()=>null);
      if(b) mf.file(safeFileName(f.name),b);
    }
  }
  if(onProgress) onProgress('Comprimiendo ZIP…');
  return await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}},m=>{
    if(onProgress) onProgress(`Comprimiendo ZIP… ${Math.round(m.percent)}%`);
  });
}
async function downloadClassZip(subId,classId){

    const zip=await buildClassZip(sub,cls,t=>{if(btn)btn.textContent=t;});

}

function mdToHtml(md){
  if(!md) return '';
  let html = escapeHtml(md);
  html = html.replace(/^## (.*)$/gm,'<h4>$1</h4>');
  html = html.replace(/^- (.*)$/gm,'• $1');
  html = html.replace(/Información complementaria/g,'<span class="comp-tag">Información complementaria</span>');
  return html;

/* ---------- Motor IA generativo local ---------- */
const FRACTAL_LLM_MODEL='Qwen2.5-0.5B-Instruct-q4f16_1-MLC';
let fractalLLMEngine=null;
let fractalLLMLoading=null;
let fractalLLMState={status:'idle',progress:0,text:'IA local no cargada'};

function setLLMState(status,progress,text){
  fractalLLMState={status,progress:Math.max(0,Math.min(100,progress||0)),text:text||''};
  const el=document.getElementById('aiModelStatus');
  if(el){
    const dot=el.querySelector('.ai-dot'), txt=el.querySelector('.ai-status-text'), bar=el.querySelector('.ai-progress span');
    if(dot) dot.className='ai-dot '+(status==='ready'?'ready':status==='loading'?'loading':status==='error'?'error':'');
    if(txt) txt.textContent=fractalLLMState.text;
    if(bar) bar.style.width=fractalLLMState.progress+'%';
  }
}
function supportsLocalLLM(){
  return !!navigator.gpu;
}
async function ensureFractalLLM(){
  if(fractalLLMEngine) return fractalLLMEngine;
  if(fractalLLMLoading) return fractalLLMLoading;
  if(!supportsLocalLLM()) throw new Error('WEBGPU_UNAVAILABLE');
  fractalLLMLoading=(async()=>{
    try{
      setLLMState('loading',2,'Preparando IA local…');
      const webllm=await import('https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm/+esm');
      const engine=await webllm.CreateMLCEngine(FRACTAL_LLM_MODEL,{
        initProgressCallback:(r)=>{
          const raw=Number(r.progress||0);
          const pct=raw<=1?Math.round(raw*100):Math.round(raw);
          setLLMState('loading',pct, pct<100?`Descargando modelo IA… ${pct}%`:'Iniciando modelo…');
        }
      });
      fractalLLMEngine=engine;
      setLLMState('ready',100,'Qwen 2.5 local listo · sin API');
      return engine;
    }catch(e){
      console.error('No se pudo iniciar WebLLM:',e);
      setLLMState('error',0,'IA generativa no disponible · usando modo local básico');
      throw e;
    }finally{
      fractalLLMLoading=null;
    }
  })();
  return fractalLLMLoading;
}
function classKnowledgeChunks(cls){
  const chunks=[];
  const add=(label,text)=>{
    const clean=repairLetterSpacedText(stripHtml(text||'')).replace(/\s+/g,' ').trim();
    if(!clean) return;
    const parts=clean.match(/.{1,650}(?:[.!?]\s|$)/g)||[clean];
    parts.forEach((x,i)=>chunks.push({label:parts.length>1?`${label} · parte ${i+1}`:label,text:x.trim()}));
  };
  add('Transcripción',(cls.transcript||[]).map(x=>x.text).join(' '));
  add('Apuntes del estudiante',cls.studentNotes||'');
  add('Apunte generado',cls.aiNotes||'');
  for(const f of cls.files||[]) add(`Archivo ${f.name}`,f.text||'');
  return chunks.slice(0,120);
}
function relevantClassContext(cls,question,maxChars=6500){
  const chunks=classKnowledgeChunks(cls);
  if(!chunks.length) return {text:'',sources:[]};
  const ranked=chunks.map(c=>({...c,score:scoreChunkForQuestion(c,question)})).sort((a,b)=>b.score-a.score);
  let picked=ranked.filter(x=>x.score>0).slice(0,7);
  if(!picked.length && /clase|materia|tema|resum|explica|estudiar|traduc|english|ingl[eé]s/i.test(question)) picked=ranked.slice(0,6);
  let text='',sources=[];
  for(const x of picked){
    if((text+x.text).length>maxChars) break;
    text+=`\n[${x.label}]\n${x.text}\n`;
    sources.push(x.label);
  }
  return {text:text.trim(),sources:[...new Set(sources)]};
}
function isEnglishSubject(sub){
  return /(^|\b)(ingl[eé]s|english)(\b|$)/i.test(sub?.name||'');
}
function chatHistoryForClass(sub,cls){
  const key=`${sub.id}:${cls.id}`;
  return state.chatBySubject[key]||(state.chatBySubject[key]=[]);
}
function llmSystemPrompt(sub,cls,hasContext){
  const english=isEnglishSubject(sub);
  return `Eres Fractal IA, un tutor de estudio preciso, claro y útil.
Reglas:
1. Responde la pregunta real del estudiante; no repitas información irrelevante.
2. Si se entrega MATERIAL DE LA CLASE, úsalo como fuente prioritaria y conserva su terminología.
3. Si la respuesta no está en el material y la pregunta es general, puedes responder usando tu conocimiento general. Distingue brevemente cuando sea información externa a la clase.
4. No inventes datos que supuestamente aparecen en el material.
5. Explica a nivel de estudiante, con ejemplos cuando ayuden. Sé breve salvo que pidan detalle.
6. Puedes traducir entre español e inglés, corregir gramática, explicar vocabulario, crear ejercicios, ejemplos y diálogos.
7. ${english?'Esta es una asignatura de INGLÉS: actúa como profesor de inglés. Por defecto explica en español, incluye el inglés correcto y traducción cuando sea útil. Corrige errores con tacto y explica el porqué.':'Responde normalmente en español, salvo que el estudiante pida otro idioma.'}
8. No necesitas limitarte al tema de la clase: el estudiante puede preguntarte cualquier cosa de estudio o conocimiento general.
Asignatura: ${sub?.name||''}
Clase: ${cls?.name||''}
${hasContext?'Hay material relevante adjunto en el mensaje del usuario.':'No se encontró material relevante de esta clase para esta pregunta.'}`;
}
async function answerWithGenerativeAI(sub,cls,question){
  const engine=await ensureFractalLLM();
  const ctx=relevantClassContext(cls,question);
  const history=chatHistoryForClass(sub,cls).slice(-6).map(m=>({role:m.role==='assistant'?'assistant':'user',content:m.text}));
  const userContent=(ctx.text?`MATERIAL DE LA CLASE:\n${ctx.text}\n\n`:'')+`PREGUNTA DEL ESTUDIANTE:\n${question}`;
  const messages=[
    {role:'system',content:llmSystemPrompt(sub,cls,!!ctx.text)},
    ...history.slice(0,-1),
    {role:'user',content:userContent}
  ];
  const res=await engine.chat.completions.create({
    messages,
    temperature:0.35,
    top_p:0.9,
    max_tokens:520,
    repetition_penalty:1.08
  });
  const text=(res?.choices?.[0]?.message?.content||'').trim();
  if(!text) throw new Error('EMPTY_LLM_RESPONSE');
  return {text,sources:ctx.sources};
}

async function buildSubjectContext(sub){
  let ctx = '';
  for(const c of sub.classes){
    ctx += `\n\n=== Clase: ${c.name} (${c.date||''}) — Tema: ${c.topic||''} ===\n`;

    for(const f of (c.files||[])){ ctx += `\nArchivo ${f.name}:\n` + (f.text||'').slice(0,2500); }
  }

}
function subjectKnowledgeChunks(sub){
  const chunks=[];
  const add=(label,text)=>{
    const clean=repairLetterSpacedText(stripHtml(text||'')).replace(/\s+/g,' ').trim();
    if(!clean) return;
    const parts=clean.match(/.{1,700}(?:[.!?]\s|$)/g) || [clean];
    parts.forEach((part,i)=>chunks.push({label:parts.length>1?`${label} · parte ${i+1}`:label,text:part.trim()}));
  };
  for(const c of sub.classes||[]){
    add(`Clase ${c.name} · transcripción`,(c.transcript||[]).map(t=>t.text).join(' '));
    add(`Clase ${c.name} · apuntes`,c.studentNotes||'');

  return chunks.slice(0,180);

function queryTerms(q){
  const stop=new Set('que qué cual cuál como cómo cuando cuándo donde dónde quien quién quienes por para con sin sobre una uno unos unas los las del desde este esta esto esos esas necesito dime explica explicame explícame quiero saber hay son es'.split(' '));
  return (q||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').match(/[a-zñü0-9]{3,}/g)?.filter(w=>!stop.has(w))||[];
}
function scoreChunkForQuestion(chunk,question){
  const terms=queryTerms(question);
  const hay=chunk.text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  let score=0;
  for(const t of terms){
    const hits=(hay.match(new RegExp('\\b'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length;
    score += hits*4 + (hay.includes(t)?2:0);
  }
  if(/resum|principal|importante|estudiar/i.test(question)) score += Math.min(3,normalizeWords(chunk.text).length/80);
  return score;
}
function answerSubjectQuestion(sub,question){
  const chunks=subjectKnowledgeChunks(sub);
  if(!chunks.length) return {text:'Todavía no hay contenido en esta asignatura. Sube un PDF/PPT/DOCX, agrega apuntes o graba una clase y luego vuelve a preguntarme.',sources:[]};
  const ranked=chunks.map(c=>({...c,score:scoreChunkForQuestion(c,question)})).sort((a,b)=>b.score-a.score);
  let picked=ranked.filter(x=>x.score>0).slice(0,5);
  if(!picked.length && /resum|clase|asignatura|estudiar|contenido|tema/i.test(question)) picked=ranked.slice(0,5);
  if(!picked.length) return {text:'No encontré esa información en los archivos, apuntes o transcripciones de esta asignatura. Puedes reformular la pregunta o subir material que contenga ese tema.',sources:[]};

  const joined=picked.map(x=>x.text).join(' ');
  let sentences=rankSentences(joined,8);
  const q=(question||'').toLowerCase();
  let response='';
  if(/resum|resumen|sintet/i.test(q)){
    response='Resumen basado en tu material:\n'+sentences.slice(0,6).map(x=>'• '+x).join('\n');
  }else if(/conceptos?|palabras? clave|importante/i.test(q)){
    const kws=topKeywords(joined,10).map(cap);
    response='Conceptos principales detectados: '+kws.join(', ')+'.\n\n'+sentences.slice(0,4).map(x=>'• '+x).join('\n');
  }else if(/preguntas?|quiz|cuestionario/i.test(q)){
    const mock={transcript:[{time:'',text:joined}],studentNotes:'',files:[]};
    const qs=generateLocalQuiz(mock).slice(0,8);
    response=qs.length?'Preguntas sugeridas:\n'+qs.map((x,i)=>`${i+1}. ${x.question}`).join('\n'):'No encontré suficiente contenido para crear preguntas.';
  }else{
    const terms=queryTerms(question);
    const direct=sentenceList(joined).filter(s=>terms.some(t=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(t))).slice(0,5);
    const use=direct.length?direct:sentences.slice(0,5);
    response=use.join(' ');
    if(response.length>1200) response=response.slice(0,1200).replace(/\s+\S*$/,'')+'…';
  }
  return {text:response||'No pude construir una respuesta útil con el material disponible.',sources:[...new Set(picked.map(x=>x.label))].slice(0,5)};
}
async function sendChat(sub){
  const cls=getClass(sub,state.view.classId);
  const input=document.getElementById('chatInput');
  const text=(input?.value||'').trim();
  if(!text || !cls) return;
  input.value='';
  const msgs=chatHistoryForClass(sub,cls);
  msgs.push({role:'user',text});
  msgs.push({role:'assistant',text:'…',pending:true});
  persist(true); render();

  try{
    let result;
    try{
      result=await answerWithGenerativeAI(sub,cls,text);
    }catch(e){
      console.warn('IA generativa no disponible; usando recuperación local:',e);
      // Respaldo sin descarga/API: responde solo con el material de la asignatura.
      result=answerSubjectQuestion(sub,text);
      if(!result.sources.length && !classKnowledgeChunks(cls).length){
        result={text:'La IA generativa local no está disponible en este dispositivo y no encontré material de clase para responder. Prueba desde Chrome/Android con WebGPU o vuelve a intentar cuando el modelo termine de cargar.',sources:[]};
      }
    }
    const sourceLine=result.sources?.length?'\nFuentes de clase: '+result.sources.join(' · '):'';
    const current=chatHistoryForClass(sub,cls);
    let i=-1; for(let j=current.length-1;j>=0;j--){ if(current[j].pending){ i=j; break; } }
    if(i>=0) current[i]={role:'assistant',text:result.text+sourceLine};
    else current.push({role:'assistant',text:result.text+sourceLine});
    persist(true);
  }catch(e){
    console.error('Error Chat IA:',e);
    const current=chatHistoryForClass(sub,cls);
    for(let i=current.length-1;i>=0;i--) if(current[i].pending){current[i]={role:'assistant',text:'⚠ No pude responder ahora. Inténtalo nuevamente.'};break;}
    persist(true);
  }finally{ render(); }
}

function relativeNewsDate(value){
  if(!value) return '';
  const d=new Date(value);
  if(isNaN(d)) return '';
  const diff=Date.now()-d.getTime(), day=86400000;
  if(diff<day) return 'Hoy';
  if(diff<day*2) return 'Ayer';
  if(diff<day*7) return `Hace ${Math.floor(diff/day)} días`;
  return d.toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'});
}

async function loadAudioNews(force=false){
  if(audioNews.loading) return;
  if(!force && audioNews.items.length && Date.now()-audioNews.loadedAt<30*60*1000) return;
  audioNews.loading=true; audioNews.error='';
  if(state.view.screen==='news') render();
  try{
    const r=await fetch('/.netlify/functions/audio-news',{cache:'no-store'});
    if(!r.ok) throw new Error('No se pudieron cargar las noticias');
    const data=await r.json();
    audioNews.items=Array.isArray(data.items)?data.items:[];
    audioNews.loadedAt=Date.now();
    if(data.partial) audioNews.error='Algunas fuentes no respondieron, pero se muestran las disponibles.';
  }catch(e){
    console.error('Actualidad de audio:',e);
    audioNews.error='No se pudo actualizar ahora. Revisa tu conexión e inténtalo nuevamente.';
  }finally{
    audioNews.loading=false;
    if(state.view.screen==='news') render();
  }
}
